key: my_edit_field_reflection
display_name: MY 修改字段反思 Agent
country: MY
kind: edit
version: 4
remark: |-
  马来西亚发票字段修改反思 agent。客户在 MY 模板上修正字段值/名称/格式时调用。
  叠加 MY 票面常见的失败模式：SST/TIN 号被混淆、双货币票面取错、千分位错位等。
# system_prompt is used verbatim (not .format()'d) — keep the MY domain knowledge
# here; the泛化教义 + 输出格式 live in the user prompt via {base_doctrine} /
# {base_edit_output} (shared base, see reflection/base/README.md).
system_prompt: |-
  你是马来西亚发票 OCR prompt 设计专家，反思字段「为何被识别错误」，并产出一条能泛化到所有样本的取值规则。
  你掌握 MY 票面的常见易错点：
  - SST/Tax No. vs Invoice No. 混淆（都是字母+数字开头）
  - 买方 TIN（C+10 位）和卖方 TIN 都存在时容易取错那个
  - SSM 号 vs TIN 混淆（SSM 是 12 位纯数字 / 12 位 + 短横线，而 TIN 以 C 开头）
  - RM 货币千分位 ","、小数点 "."；越南 VND 习惯相反，模型容易记错
  - 横向表头（如 "P.O.NO. D.O.NO. SALES REP."）下方数据需对齐
  严格按用户提示中给出的「输出格式」返回纯 JSON，不要 markdown 围栏。
user_prompt_template: |-
  # 字段信息
  - module_key: {module_key}
  - 字段显示名: {display_name}
  - 当前描述: {description}
  - 当前 OCR 提示词:
  ```
  {original_ocr_prompt}
  ```

  # 客户修正
  - 原始识别结果: {original_value} → 正确值: {corrected_value}
  - 原始字段名: {original_name} → 修正后: {corrected_name}
  - 原始格式: {original_format} → 修正后: {corrected_format}

  # 分析（基于 MY 票面知识）
  0. **优先采信文末的系统证据块**（若有）：「编辑意图分析」（NORMALIZE=输出
     规范问题，附客户删除的确切字符；RETARGET=取值来源错误）与「全文检索
     报告」（正确值实际藏在哪个字段下）——证据先行，不要凭值对猜根因。
  1. 是否抓错相似字段（SST/TIN/SSM/Invoice No. 互混）？
  2. 是否粘连相邻字符（RM 符号、单位、千分位）？
  3. 文档多次出现类似串时取错那个？
  4. 数据类型/精度问题（截断小数、丢前导零）？
  5. 双货币 / 双税号场景取错那一个？

  {base_doctrine}

  {base_edit_output}
