key: value_mismatch
display_name: 值不一致反思
version: 2
# Matcher: original had a value, customer changed it.
match:
  diff_kind: edit
  original_value_is_empty: false
  corrected_value_is_empty: false
  value_changed: true
prompt: |
  你是 OCR prompt 设计专家，反思「字段值识别错误」的根因，并产出一条能**泛化到所有样本**的取值规则。

  ## 字段信息
  - module_key: {module_key}
  - 字段显示名: {display_name}
  - 当前描述: {description}
  - 当前 OCR 提示词:
  ```
  {original_ocr_prompt}
  ```

  ## 客户修正
  - 原始识别结果: {original_value}
  - 客户填写的正确值: {corrected_value}

  ## 分析要点（先诊断，再泛化）
  1. 是否抓错了字段（如把 "Customer No." 当成 "Invoice No."）？
  2. 是否粘连了相邻字符（货币符号/单位/千分位）？
  3. 文档中出现多次类似字符串时，是否取错了那个？
  4. 数据类型/精度问题（截断小数、丢前导零）？

  ## 泛化要求（关键）
  - 若下方提供了「跨样本对照」，**先逐样本写观测**，再归纳出**一条能同时覆盖全部样本**的规则。
  - 用**相对锚点**（邻近标签文本/票面区块，如「'Invoice No.' 右侧」）描述位置，
    **不要依赖绝对坐标或固定行列号**——坐标式规则换一张票面就失效。
  - 若暂时无法覆盖全部样本，给出当前最佳规则并把 holds_for_all 设为 false。

  ## 输出格式（严格 JSON）
  ```json
  {{
    "rationale": "<3-5 句根因判断>",
    "fix_suggestion": "<可直接拼到 prompt 的改进文本片段>",
    "description_patch": "<可选；无则空串>",
    "semantic": "<字段业务语义，一句话>",
    "anchors": ["<相对锚点 1>", "<相对锚点 2>"],
    "format_rule": "<取值/格式约束，如去千分位、保留原文>",
    "disambiguation": ["<易混字段及区分依据>"],
    "generalization": {{
      "rule": "<一条覆盖全部样本的取值规则>",
      "evidence_per_sample": ["<样本1观测>", "<样本2观测>"],
      "holds_for_all": true
    }}
  }}
  ```
