key: format_mismatch
display_name: 格式/类型反思
version: 2
# Matcher: applies when the customer changes the field's name or format (type)
# regardless of value diff.
match:
  diff_kind: edit
  any_of:
    - name_changed: true
    - format_changed: true
prompt: |
  你是 OCR prompt 设计专家，反思「字段命名/输出格式不符合预期」，并产出一条能**泛化到所有样本**的格式规则。

  ## 字段信息
  - module_key: {module_key}
  - 字段显示名: {display_name}
  - 当前描述: {description}
  - 当前 OCR 提示词:
  ```
  {original_ocr_prompt}
  ```

  ## 客户修正
  - 原始字段名: {original_name} → 修正后: {corrected_name}
  - 原始格式/类型: {original_format} → 修正后: {corrected_format}
  - 原始值: {original_value} → 修正后值: {corrected_value}

  ## 分析要点
  1. 命名是否需更精确（原名是否模糊/不符行业惯例）？
  2. 数据类型是否需严格（number / date / boolean）？
  3. 输出形式是否需规范化（日期 ISO、金额纯数字、电话去横线）？

  ## 泛化要求（关键）
  - 格式规则必须对**所有样本**一致生效；若下方有「跨样本对照」，用各样本的值验证规则。
  - 描述「怎么规范化」时用值的形态/模式（如「YYYY-MM-DD」「纯数字无千分位」），
    不要依赖某一张票面的具体写法。

  ## 输出格式（严格 JSON）
  ```json
  {{
    "rationale": "<3-5 句对修改意图的理解>",
    "fix_suggestion": "<新 OCR 提示文本片段，明确写出输出格式约定>",
    "schema_patch": {{ "type": "<STRING/NUMBER/INTEGER/...>", "format": "<可选 ISO 8601 等>" }},
    "description_patch": "<更新后的字段描述，无则空串>",
    "semantic": "<字段业务语义，一句话>",
    "anchors": ["<相对锚点>"],
    "format_rule": "<规范化规则，如 日期统一 YYYY-MM-DD / 金额纯数字去千分位>",
    "disambiguation": ["<易混字段及区分依据>"],
    "generalization": {{
      "rule": "<覆盖全部样本的格式规则>",
      "evidence_per_sample": ["<样本1值→规范化后>", "<样本2值→规范化后>"],
      "holds_for_all": true
    }}
  }}
  ```
