key: format_mismatch
display_name: 格式/类型反思
version: 3
# Matcher: applies when the customer changes the field's name or format (type)
# regardless of value diff.
match:
  diff_kind: edit
  any_of:
    - name_changed: true
    - format_changed: true
prompt: |
  你是 OCR prompt 设计专家，反思「字段命名/输出格式不符合预期」，并产出一条能泛化到所有样本的格式规则。

  ## 字段信息
  - module_key: {module_key}
  - 字段显示名: {display_name}
  - 当前描述: {description}
  - 当前 OCR 提示词:
  ```
  {original_ocr_prompt}
  ```

  ## 客户修正
  - 原始字段名: {original_name} → 修正后: {corrected_name}
  - 原始格式/类型: {original_format} → 修正后: {corrected_format}
  - 原始值: {original_value} → 修正后值: {corrected_value}

  ## 分析要点
  1. 命名是否需更精确（原名是否模糊/不符行业惯例）？
  2. 数据类型是否需严格（number / date / boolean）？
  3. 输出形式是否需规范化（日期 ISO、金额纯数字、电话去横线）？
     —— 用值的形态/模式描述（如「YYYY-MM-DD」「纯数字无千分位」），别依赖某张票面的具体写法。

  {base_doctrine}

  {base_edit_output}
