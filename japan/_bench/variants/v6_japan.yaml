id: 'jp-v6'
remark: 日本 invoice/receipt 专用 prompt v6 — v3 + 修正「但し書き吞掉明细表」bug（有逐行明细表时必须逐行抽，但し書き只在无明细表时兜底）+ taxCategory 用票面原词
template_config:
  fill_empty_items: false
prompt_template:
  prompt_format: |-
    **任务描述：**
    你是日本票据识别专家。请识别并提取用户提供文档中的所有日本发票（請求書）和收据（領収書・レシート）信息。
    文档可能是：多张小票混贴在一张台纸上的扫描件、多页的請求書、或单张票据。

    **输入说明：**
    - 文档为 PDF 或图片；可能存在倾斜、旋转、印刷不清、感热纸褪色等情况。
    - 票面语言以日语为主，可能夹杂英语。

    **输出：** JSON 数组，每个元素是一条票据记录。

    ═══════════════════════════════════════════════
    第一部分：实体切分 —— 什么算「一条记录」
    ═══════════════════════════════════════════════
    这是最重要的部分。切错会导致整条记录作废。

    **1. 一条记录 = 一个独立票面单元**
    一张物理上独立的凭证（有自己的发行方、金额、日期，边缘可辨）算一条。
    同一张凭证内部的多个印刷区块（表头、明细、支付栏、切取线两侧）**合为一条**。

    **2.「領収書/領収証」与同票的「明細」是同一条，禁止拆开**
    同一张纸或同一条感热纸卷上，上半部是「領収書」「領収証」，下半部是「領収書明細」
    「ご利用明細」「航空券明細」「きっぷの明細」「明細書」且**金额与上半部相同**时，
    只输出一条：标题取「領収書/領収証」，金额取合计，明细行放进这条记录。

    **3.「請求書」与「請求明細書」：看合计**
    - 明細書没有独立合计（只有小計/累計/「ページ n / N」续页标记）→ **并入請求書**，同一条，page 列出全部页码。
    - 明細書有自己的合计但**与請求書合计相同** → **并入請求書**（这是同一张票的明细面）。
    - 明細書有自己的表头（宛名＋実施店舗/物件名＋期間）且**合计与請求書不同**（是总额的分项）→ **各自独立一条**。

    **4.「請求書＋附上的一堆領収書」装订件：只输出請求書**
    首页是供应商开出的正式「請求書/御請求書」（有請求金額、振込先），后续页是为佐证该金额而
    附上的酒店/JR/停车領収書与明细 → **只输出该請求書一条**，其余页记 other。
    反之，首页是**内部单据**（出張旅費精算書 / 交通費明細書 / 経費精算書）→ 首页记 other，
    后面每张領収書**各自输出一条**。

    **5. クレジット/QR/iD 的「売上票」「支払票」「取引伝票（お客様控え）」不单独成条**
    它们与紧邻其上的領収書是同一次交易的两联，合并为一条，以領収書为准
    （商家名取領収書上的正式名称，不取信用卡终端上的半角片假名商户名）。

    **6. 下列内容一律 `docType: other`（只输出 docType 和 page 两个字段）**
    出張旅費精算書 / 交通費明細書 / 経費精算書等内部报销表单；
    返品伝票 / 納品伝票 / 受領書等伝票类及其「控」联；
    作業明細・技術サービス費請求明細（部品添付用・メーカー控）；
    IC 卡（Suica/PASMO）利用履歴打印件；保険契約証 / WEB契約証；
    リースお支払明細書 / リース契約のご確認書；予約一覧表；空白页、分隔页、宣传页。

    **7. 禁止按「金额/商家重复」去重 —— 相同金额的两张票仍是两条**
    同一页上两张都是 ¥1,400 的巴士票是两条独立记录。

    **8. 台纸本身也是一张票时，大小张都要输出**
    A4 正式領収書被当作台纸、上面又贴了小票 → 大张和小张都必须各输出一条。

    **9. 竖排、旋转、被压边、极小的凭证必须计入**
    逐页做**四方向**扫视：竖排的「領収証 金○○円」、旋转 90° 的票、小张异形票
    （新幹線/特急券的绿色小票、車券、印紙）都要单独成条，不得因方向或尺寸跳过。

    ═══════════════════════════════════════════════
    第二部分：计数与防重复 —— 输出前必须执行
    ═══════════════════════════════════════════════
    **1. 两阶段作业**：先建立「票面单元清单」，逐个记下（位置、商家、合计金额、日期、票面唯一号）；
       清单封闭后，才逐条转成 JSON。输出记录数必须等于清单条数，不多不少。
    **2. 位置可指认**：每条记录都要能指出票面上的一个物理位置（左上/右中/第3页左下）。指不出新位置的记录不得输出。
    **3. 禁止编号外推**：票号只能从票面直接读取。读到 NO.008668 **严禁**输出 008669、008670…
    **4. 禁止日期外推**：**严禁**按逐日递增/递减生成日期序列。
    **5. 重复三元组检查**：两条记录的（商家、日期、合计金额）完全相同时，必须各自对应票面上
       两个不同的物理位置且各有不同的票面唯一号；做不到就删掉后一条。
    **6. 上限自检**：一张 A4 混贴扫描件上的独立小票通常不超过 12 张。清单超过 12 条就停下重新核对。
    **7. 不确定就 other**：拿不准某区块是否构成独立票据时，输出 `docType:"other"`，不要猜成 invoice/receipt。

    ═══════════════════════════════════════════════
    第三部分：票据分类（docType 由票面标题决定）
    ═══════════════════════════════════════════════
    - **receipt**：標題含 領収書 / 領収証 / 領収 / 受領書 / レシート / ご利用証明書 / ご利用証明 /
      利用証明書 / ご利用明細書 / 利用明細書 / 明細書 / 診療明細・領収書 /
      クレジットカードご利用明細票 / RECEIPT / DETAILED STATEMENT。
      **无标题的零售小票**（只有店名＋商品＋合計）也是 receipt。
    - **invoice**：標題含 請求書 / 御請求書 / ご請求書 / 請求明細書 / 御請求明細書 / 見積書 /
      御見積書 / 口座振替のお知らせ / 口座振替のご案内 / INVOICE / Information of Current Bill。
    - **复合标题**：「請求書 兼 領収書」→ invoice；「納品書(領収書)」「領収書兼利用明細書」→ receipt。
      即：請求 与 領収 同时出现时，看哪个是主标题（在最前面）。
    - **other**：见第一部分第 6 条。

    ═══════════════════════════════════════════════
    第四部分：字段取值口径
    ═══════════════════════════════════════════════
    - 保持原文：提取内容保留票面原文（日文按日文原样），不翻译。
    - **票面上有的信息尽量都抽**；票面上确实没有的字段才不输出，不推断、不编造。

    **【日期】** 统一输出 YYYY-MM-DD：
      - 和暦换算：令和N年 = 2018+N（令和7年=2025）；平成N年 = 1988+N；R7.5.1 → 2025-05-01；H31.4.30 → 2019-04-30。
      - 2025年5月1日 / 2025/05/01 / 2025.05.01 → 2025-05-01；两位年份按 20YY（25.5.1 → 2025-05-01）。
      - 年份必须 ≥2015。
      - **一张票有多个日期时的优先级**：①「発行日」「表示日」「取引日時」「精算時刻」「領収日」；
        ② 无上述标注时取「購入日」「利用日」；③「乗車日」「宿泊日」「対象月」「契約期間」**不是** invoiceDate。
        例：JR 票「表示日 2025年5月21日」与「購入日 2025年5月20日」并存 → 取 2025-05-21。

    **【金额】**
      - 日元为整数，千分位逗号：「¥1,234,567」→ 1234567。输出纯数字，不含符号和千分位。
      - **「円」不是数字 0**：「¥1,300円」= 1300（不是 13000）。末尾的「円」是单位字，绝不能拼进数字。
        同理「10%」的 10、「(内税)」等相邻文字都不得混入金额。
      - 负数（返金、値引き、赤伝）输出负数。
      - **totalAmount 取最终总额**：請求書取「御請求金額」「差引き御請求額」「合計金額」框内的最终额，
        不取明细行的单行合计；同票有多层合计时取最大层级那个。

    **【消費税】**
      - 税率 10%（标准）与 8%（軽減税率，饮料食品；票面「※」「＊」标记）。
      - 内税（税込表示）：总额已含税；外税（税抜表示）：总额 = 税抜 + 消費税。

    **【登録番号 —— 格式硬约束 + 互斥硬约束】**
      **格式**：登録番号是「T + 恰好 13 位数字」（或带连字符如 T3-0110-0101-8770，去掉连字符后
      仍是 13 位）。位数不足 13 位、或前面是「〒」而非「T」的，**都不是登録番号**：
      · `〒2860106`（7 位，邮编）→ 不是登録番号，属于地址，绝不能填进税号字段；
      · `T401000113724`（12 位）→ 位数不对，说明少读了一位，请重新逐位读取。
      提取后必须数一遍位数，确认恰好 13 位数字再输出。
      **互斥**：T+13 位数字**只能填入 billFromTaxIdentificationNumber**，严禁填入
      invoiceNumber / invoiceCode / shipmentNumber / purchaseOrderNumber；
      反之 invoiceNumber 也绝不能是 T+13 位数字。
      **逐票独立**：混贴页上每张小票各有各的登録番号，必须取自该张小票自身。
      自检：同一页上商家名不同的两张小票，其登録番号必须不同（相同说明串票了，必须重查）。

    **【混贴页禁止跨票借字段】**
      每张小票的所有字段只能取自它自己的边界内。相邻小票的公司名、宛名、金额、登録番号不得借用。

    **【明细行提取】**
      - GT 口径只用这些子字段：articleName / netAmount / grossAmount / taxRate / description / tax / orderNumber。
        **不要输出 quantity、unitPrice、unitOfMeasure**，也**禁止用 数量×単価 计算金额**，
        金额一律照抄票面某一列。
      - **articleName 只取品名本体**：剥掉行首商品コード＋＊前缀（`202101＊ボンカレーゴールド中辛` → `ボンカレーゴールド中辛`）、
        单价前缀（`110円普通切手・千鳥` → `普通切手・千鳥`）、标签词头（`但し）`『取引内容:』）。
        表格有「品目｜詳細｜…」多列时 articleName 只取品目列。
        票面被截断的品名**原样照抄不补全**。日英并排的品名用单个空格连接（`関税 Total Custom Duty`）。
      - **description = 品名旁的第二段文字**，且**开头的「※」「＊」「*」一律删除**：
        備考/摘要列内容（`※実費` → `実費`）、品名后括号补充（`駐車料金（一般）` → name`駐車料金`+desc`一般`）、
        同行料金种别副标签（`駐車料金 B料金 400円` → name`駐車料金`+desc`B料金`+grossAmount 400）。
      - **「标签:值」型信息行也要输出**：内訳/課税対象/旅行内容/フライト情報 区块下一行一对的内容，
        值是文字 → articleName=标签、description=值（`搭乗者名`/`KUTSUMA KYOHEI`）；
        值是金额 → articleName=标签、金额进 net/gross（`10%対象` 5450、`課税対象外` 127870）。
      - **但し書き只在没有明细表时兜底（重要）**：
        · 票面**有**逐行商品/菜品/服务明细表（含点单明细、请求明细、費用一覧）→ **必须逐行提取该明细表**，
          哪怕行数很多（几十行也要全部输出）。此时**不要**只输出一条「〜として」概括行。
        · 票面**只有**一句用途说明、没有任何逐行明细 → 才产出一条明细行，articleName 取该句原文
          并保留「〜として」（`乗車運賃代として`、`高速バス代金として`）。
        · 判别：先在票面（含背面/下半部/续页）找有没有成列排布的品名+金额；找到就走逐行提取。
      - **金额为 0 或空的行同样输出**（費用一覧表的「運賃／保管料／その他①②」等），填 `grossAmount: 0`。
      - **netAmount / grossAmount 的填法（重要）**：
        · 票面该行**只印了一个金额**（绝大多数小票和明细表都是这种）→ 把这个金额**同时填入
          netAmount 和 grossAmount 两个字段**（同一个数值，不做任何换算）。不要二选一。
        · 票面该行**同时印出税抜额与税込额/税额**时 → netAmount 填税抜额、grossAmount 填税込额、
          tax 填税额（`¥7,700-(税 ¥700-)` → net 7000 / tax 700 / gross 7700）。
        · **禁止换算**：不得用 gross÷1.1 推 netAmount，也不得用 net×1.1 推 grossAmount。
          只有票面印出来的数才能填。
      - **不作为明细行**：小計 / 合計 / 料金計 / お預り / お釣り / 釣銭額 / 投入現金 / 現金領収額 /
        お買上点数 / クレジット支払 一律不进明细（金额进 totalAmount / totalNetAmount）。
      - taxRate 只在票面该行明示税率时填（`10%`/`8%`），**不要给没有税率标记的行编造 `0%`**。

    **【税金汇总 detailOfTaxSummary】**
      - **条数：0 条或 1 条；只有票面真的同时印出 8% 与 10% 两栏时才输出 2 条。**
        不要把「課税計」「非課税計」「内消費税」拆成多条。
      - **只要票面出现税率标注，就必须输出一条 —— 哪怕没有任何金额**：
        `(消費税10%を含む)`、`税10%`、`消費税等込み 税10%`、`全て消費税10%適用対象`、`消費税率10%`
        → 输出 `[{"taxRate":"10%"}]`。
      - **taxCategory = 票面税种词的「裸词」**，剥掉税率、括号、修饰与后缀：
        `消費税10%対象` → `消費税`；`課税（10%）` → `課税`；`全て消費税10%適用対象` → `消費税`；
        `10%税抜対象額` → `税抜`。GT 常见取值：消費税 / 内税 / 税込 / 消費税等 / 消費税率 / 消費税額 /
        内消費税 / 課税 / 消費税相当額 / 税抜 / 日本消費税。**票面没有税种词时不输出该字段。**
      - **netTaxableAmount = 票面上与该税率并列的对象金额，原样照抄，绝不换算、不判断税抜还是税込**：
        `(内税10%対象額 400円)` → 400；`対象合計 7,600円` → 7600；`10%対象 6,132,435` → 6132435。
      - **只有票面完全没印对象额时才换算，且保留两位小数**：只印「消費税は10%です」+ 税込总额 1,000
        → `netTaxableAmount: 909.09`, `tax: 90.91`（不要输出整数 909/91）。
      - **tax 取票面明示的税额**（`内消費税 690円`），不要用 対象額×税率 反算。
  json_schema:
    title: japan_invoice_and_receipts
    type: ARRAY
    items:
      anyOf:
        - type: OBJECT
          properties:
            docType:
              type: STRING
              description: 票据类型：invoice（請求書类）或 receipt（領収書・レシート类），按票面标题判定
              enum:
                - invoice
                - receipt
            page:
              type: ARRAY
              description: 该票据所在的页码列表（从1开始）。跨页票据列出全部页码，如 [2, 3, 4]。
              items:
                type: NUMBER
            invoiceType:
              type: STRING
              description: |-
                票据细分类型：docType=invoice 时填 'Invoice'；docType=receipt 时填 'Receipt'；
                赤伝/返金票据或合计为负数时填 'Credit Note'。
              enum:
                - Invoice
                - Receipt
                - Credit Note
            nameOfInvoice:
              type: STRING
              description: |-
                票面标题，**按票面原样逐字输出**：
                - 复合标题整体输出：「利用明細書(お客様控え)兼領収書」「請求書 兼 領収書」「納品書(領収書)」。
                - 标题里的空格照保留（「領 収 証」）。
                - 日文标题下方紧跟英文对译时（「領収書 RECEIPT」「明細書 DETAILED STATEMENT」）两者都保留。
                - 区分「領収書」与「領収証」、「請求書」与「請求明細書」，按票面实际用字，不要互相替换。
                - 同一张票上半部与下半部标题不同时（如上「領収書」下「ご利用明細書」），取**主标题**
                  （字号更大、位于票据顶部的那个）。
            invoiceNumber:
              type: STRING
              description: |-
                票据编号。**只输出编号本体，剥离标签前缀**：「No.」「NO.」「№」「精算No.」「領収No.」
                「発券No.」「レシートNo.」「伝票番号」「取引No.」等一律不进值。
                例：票面「No.01-000061」→ 输出 `01-000061`；「精算No.000571」→ `000571`；「No.5806」→ `5806`。
                编号本体自带的字母/连字符保留（419430-DP、11856726-1）。
                **同票多个编号时的优先级**：①与票据标题同行或紧邻方括号内的编号（「《領収書》[No. 16]」→ `16`）；
                ②标注为「請求書番号」「ご請求番号」「領収No.」「精算No.」的编号；
                ③票尾的机器流水号（NO.008668 之类的机番/連番）优先级最低，前两者存在时不取。
                **禁止项**：登録番号（T+13位）、电话号码、カード番号、承認番号、端末番号、加盟店取引番号、バーコード数字都不是 invoiceNumber。
            invoiceCode:
              type: STRING
              description: |-
                与 invoiceNumber 并列存在的「第二个编号」，只在票面确有时输出：
                ①停车场領収証上与「No.xxx」并排的「券No.」「発券No.」→ 取数字部分（`10-790225`），不带前缀；
                ②零售小票日期时刻行上的收银机号/收据流水号：「レジ 0004」「レジ No.:0002」「#000007」→ 取数字本体。
                若某编号已给了 invoiceNumber，invoiceCode 取另一个，不重复。
            invoiceDate:
              type: STRING
              description: 开票/交易日期，YYYY-MM-DD（和暦须换算）。多日期时按正文的优先级规则取。
            dueDate:
              type: STRING
              description: |-
                付款截止日期，YYYY-MM-DD。
                ①票面明写「お支払期限」「支払期日」「振込期限」时直接取。
                ②**票面没明写日期但写了付款条件文句时，须结合 invoiceDate 换算出具体日期**：
                「毎月末日締め 翌月末支払い」「月末締め翌月末払い」→ 开票月次月的最后一天
                （invoiceDate=2025-05-31 → dueDate=2025-06-30）；「翌月NN日払い」→ 次月 NN 日；
                「当月末払い」→ 当月最后一天；「〜日以内」→ invoiceDate + N 天。
                一份請求書跨多页时，抬头的支付条件适用于该請求書的全部记录。
            paymentDueInDays:
              type: NUMBER
              description: 仅当付款条件本身以天数表述时输出该天数。
            totalNetAmount:
              type: NUMBER
              description: 全票不含税合计（税抜金額・小計（税抜））。票面有多个部分时求和后输出。
            totalAmount:
              type: NUMBER
              description: 含税总金额（合計・ご請求金額・お買上げ合計・税込合計）。注意「円」不是数字 0。
            totalTaxAmount:
              type: NUMBER
              description: 消費税合计（消費税・消費税等・内消費税）。8% 与 10% 并存时输出两档之和。取票面明示税额，不用总额反推。
            taxRate:
              type: STRING
              description: 整单单一税率时的税率，`数字%` 形式。多档并存时不输出（在 detailOfTaxSummary 分档）。
            currency:
              type: STRING
              description: 币种 ISO 4217 代码。日文票据无外币标记时输出 "JPY"。
            billToName:
              type: STRING
              description: |-
                收票方（宛名）名称。
                **1. 保留敬称**：末尾的「様」「御中」「殿」**按票面原样保留，不要剥离**
                （「TVS REGZA株式会社 御中」→ 原样输出；名称与敬称之间的空格照抄）。
                **2. 空白宛名**：宛名栏空白/划线/仅印有预印的「様」时，输出「様」，不要留空、不要填「上様」。
                **3. 位置**：請求書上在**左上角**、名称后跟 御中/様；領収書上在「宛名」「RECEIVED FROM」「お名前」标签之后。
                右下角带登録番号/振込先的方框是开票方，不是收票方。
                **4.** 名称后印的部门/担当随名称一起输出。
            billToComposite:
              type: STRING
              description: 收票方的完整地址信息（票面有才输出），含〒邮编。
            billToCountry:
              type: STRING
              description: 收票方所在国家代码，日本输出 "JP"。
            billToTaxIdentificationNumber:
              type: STRING
              description: 收票方的登録番号/法人番号（票面明确标注时才输出）。
            billFromName:
              type: STRING
              description: |-
                开票方名称。
                **1. 法人名优先**：票面同时出现「设施名/店铺名/品牌标题」与「带法人格的公司名」
                （株式会社/(株)/有限会社/合同会社/協同組合）时，取带法人格的公司名。
                法人名通常印在「登録番号」的上一行或同一区块、票尾、或印章处，字号往往小于顶部标题。
                例：顶部「アミュプラザ鹿児島駐車場」+ 票身「登録番号T8340001005089 株式会社JR鹿児島シティ」
                → 取「株式会社JR鹿児島シティ」。例：顶部「ENEOS」+ 票身「宝扇商事株式会社」→ 取后者。
                **2. 剔除下位组织名**：品牌/法人名之后紧跟的店铺名、分店名、营业所名不属于 billFromName，
                须剔除（改放 billFromComposite）：〜店 / 〜駅前店 / 〜支店 / 〜営業所 / 〜事業所 /
                〜出張所 / 〜センター / 〜郵便局。
                例：「Seria 和光市駅前店」→ billFromName=`Seria`，billFromComposite=`和光市駅前店`；
                「SUPER MARKET TAJIMA 武蔵浦和白幡店」→ `TAJIMA`；
                「ジェイアール四国バス株式会社 徳島支店」→ `ジェイアール四国バス株式会社`。
                **3. 绝不取宛名**：「宛名」「RECEIVED FROM」「御中」「様」所指的名称是收票方，任何情况下不得填入此字段。
                **4. 不取第三方**：家主名/管理会社/仲介会社/加盟店取引番号所属公司不是开票方。
                **5. 同票取同源**：混贴页上必须取自该张小票自身，严禁沿用相邻小票或台纸大票上的公司名。
                **6. 日英并记**：法人名下方紧跟英文法人名时两者都保留（「東海旅客鉄道株式会社 Central Japan Railway Company」）。
                **7. 半角カナ**：加盟店名为半角片假名时（ﾆﾂﾎﾟﾝ ﾕｳﾋﾞﾝ）转为全角片假名输出（ニッポンユウビン）。
            billFromComposite:
              type: STRING
              description: |-
                开票方地址。
                **1. 首选完整住所，且必须包含票面上的邮编、含「〒」符号本身**：
                「〒2860106 千葉県成田市取香263-1」→ 原样输出含〒的整串，不得只输出后半段。
                多行地址（〒/都道府県/建物名/階/部署）全部拼接输出。末尾的部署名（東日本営業本部SP2部）保留。
                **2. 票面没印地址时，退而填开票方的下位标识**（此时不可留空）：
                店铺/分店名（和光市駅前店、ダイソー和光店）、营业所/事业所名（保守管理事業所）、
                交通票的发行站/发行机（広島駅N33発行、阿南駅）、设施内位置（南ウイング3F、池袋 改札外 北口）。
                **3. 禁止项**：电话号码、FAX、营业时间、URL 单独出现时**不得**作为此字段输出
                （只印了「TEL048-424-3668」而无地址 → 该字段取店铺名，不取电话）。地址串本身带 TEL 时可随地址保留。
            billFromCountry:
              type: STRING
              description: 开票方所在国家代码。日本票据输出 "JP"（不要输出 "Japan"）。
            billFromTaxIdentificationNumber:
              type: STRING
              description: |-
                开票方的適格請求書発行事業者登録番号（T+13位数字，如 T8010001140514；票面带连字符则保留）
                或 13 位法人番号。查找「登録番号」「登録No.」「事業者登録番号」标注，常在店名附近或票据末尾。
                **互斥**：T+13 位数字只能填这里，不得填进 invoiceNumber / invoiceCode。
                **逐票独立**：混贴页上取自该张小票自身，不得串号。
                一张票上有多个登録番号时（管理会社/仲介会社），取与 billFromName 所指法人对应的那一个。
            purchaseOrderNumber:
              type: STRING
              description: 注文番号/PO番号（票面明确标注时输出）。
            shipmentNumber:
              type: STRING
              description: 出荷番号/送り状番号（运输类票据，票面明确标注时输出）。
            detailOfGoodsOrServices:
              type: ARRAY
              description: 商品或服务明细列表。取值口径见正文「明细行提取」。不要输出 quantity/unitPrice/unitOfMeasure。
              items:
                type: OBJECT
                properties:
                  articleName:
                    type: STRING
                    description: 品名本体（剥掉商品コード/单价/标签词前缀；截断的原样照抄；日英并排用空格连接）。
                  description:
                    type: STRING
                    description: 品名旁的第二段文字（備考/摘要列、括号补充、料金种别副标签、税区分标记）。开头的「※」「＊」必须删除。
                  netAmount:
                    type: NUMBER
                    description: |-
                      该行不含税金额。票面该行只印一个金额时，把该金额同时填入 netAmount 与 grossAmount
                      （同值，不换算）；票面同时印出税抜与税込时，此处填税抜额。禁止由 grossAmount 换算。
                  grossAmount:
                    type: NUMBER
                    description: |-
                      该行含税金额。票面该行只印一个金额时，与 netAmount 填同一个值；票面同时印出税抜与
                      税込时，此处填税込额。金额为 0 的行也要填 0。禁止由 netAmount 换算。
                  taxRate:
                    type: STRING
                    description: 该行税率，`数字%`（「※」「＊」标记通常为 8% 軽減税率）。票面无税率标记时不填，不要编造 "0%"。
                  tax:
                    type: NUMBER
                    description: 该行税额（票面明示时才填）。
                  orderNumber:
                    type: STRING
                    description: 该行对应的注文番号（票面有才输出）。
                required: []
            detailOfTaxSummary:
              type: ARRAY
              description: |-
                税金汇总。**0 条或 1 条；只有票面真的同时印出 8% 与 10% 两栏时才 2 条**，
                不要把「課税計」「非課税計」「内消費税」拆成多条。
                **只要票面出现税率标注就必须输出一条，哪怕只有税率没有金额**（如 `[{"taxRate":"10%"}]`）。
              items:
                type: OBJECT
                properties:
                  taxCategory:
                    type: STRING
                    description: |-
                      票面税种词的**裸词**，剥掉税率/括号/修饰：`消費税10%対象`→`消費税`；`課税（10%）`→`課税`；
                      `10%税抜対象額`→`税抜`。常见：消費税/内税/税込/消費税等/消費税率/消費税額/内消費税/課税/消費税相当額/税抜。
                      **必须用票面实际印的那个词，不要统一改写成「消費税」**：票面印「内税」就输出 `内税`，
                      印「税込」就输出 `税込`。只有票面确实印着「消費税」时才输出 `消費税`。
                      **票面没有税种词时不输出该字段。**
                  taxRate:
                    type: STRING
                    description: 税率，`数字%`（"8%"、"10%"）。非課税/免税输出 "0%"。
                  netTaxableAmount:
                    type: NUMBER
                    description: |-
                      票面上与该税率并列的对象金额，**原样照抄，绝不换算，也不要判断它是税抜还是税込**
                      （`対象合計 7,600円`→7600；`10%対象 6,132,435`→6132435）。
                      仅当票面完全没印对象额时才由税込总额换算，且**保留两位小数**（1000 税込 → 909.09）。
                  tax:
                    type: NUMBER
                    description: 票面明示的税额（`内消費税 690円`→690）。不要用 対象額×税率 反算。仅换算时保留两位小数（→90.91）。
                required: []
          required:
            - docType
            - page
            - currency
        - type: OBJECT
          properties:
            docType:
              type: STRING
              description: 非独立票据的内容（内部报销单、伝票控、IC卡履歴、契約証、空白页、分隔页等）
              enum:
                - other
            page:
              type: ARRAY
              description: 所在页码列表（从1开始）。
              items:
                type: NUMBER
          required:
            - docType
            - page
