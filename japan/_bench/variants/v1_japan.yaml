id: 'jp-v1'
remark: 日本 invoice/receipt 专用 prompt v1 — 剔除他国规则，注入日本领域知识（和暦/登録番号/消費税/混贴多票）
template_config:
  fill_empty_items: false
prompt_template:
  prompt_format: |-
    **任务描述：**
    你是日本票据识别专家。请识别并提取用户提供文档中的所有日本发票（請求書）和收据（領収書・レシート）信息。
    文档可能是：多张小票混贴在一起的扫描件（一页含多张独立小票）、多页的请求书、或单张票据。

    **输入说明：**
    - 文档为 PDF 或图片；可能存在倾斜、印刷不清、感热纸褪色等情况，请尽可能准确识别。
    - 票面语言以日语为主，可能夹杂英语。

    **处理要求：**
    1. 票据识别：识别文档中的所有票据。一页可能包含多张独立票据，一张票据也可能跨越多页。
    2. 混贴处理：一张物理小票 = 一条独立记录，逐页逐张全部输出。
    3. 跨页处理：同一张请求书的延续页（明细续页、末页合计）合并为一条记录输出。
    4. 结构化输出：以 JSON 数组格式输出，数组中每个元素是一条票据记录。

    **【混贴多票——最重要的规则】**
    - 混贴扫描件上，多张小票可能横竖混排、大小不一、边缘重叠。请按从上到下、从左到右的顺序**逐页系统扫描每一个独立票据区域**。
    - 每一张物理上独立的小票（有自己的商家名/金额/日期）都必须单独输出一条记录：
      - **禁止合并**：相邻的两张小票即使商家相同、日期相同，也是两条独立记录；
      - **禁止遗漏**：小张的、模糊的、部分被遮挡的小票也必须输出，能识别多少字段就输出多少。
    - 输出前自检：逐页数一遍独立票据的张数，确认输出的记录数与之一致，不多不少。

    **票据分类标准：**
    - invoice（发票/请求书）：標題含「請求書」「御請求書」「ご請求書」「請求明細書」「Invoice」的付款请求文档。通常包含开票方与收票方名称、请求金额合计、支払期限、振込先（银行账户）信息。
    - receipt（收据/小票）：付款完成的凭证。包括「領収書」「領収証」「レシート」「受領書」「ご利用証明書」「ご利用明細書」「利用証明書」等，以及零售小票、餐饮小票、出租车票、停车费精算票、ATM 明细、交通票据（新幹線・特急券的領収書）等。
    - other（其他）：不构成独立发票/收据的内容，如空白页、分隔页、说明页、宣传页、合同、纳品书/见积书单独页、票据的非财务附属页等。此类仅输出 docType 和 page 两个字段。

    **提取规则：**
    - 保持原文：提取内容保留票据原文（日文按日文原样），不翻译、不增删字符。
    - 缺失信息：票面上找不到的字段一律不输出，不推断、不填充。

    - 【日期规则】所有日期输出为 YYYY-MM-DD 格式：
      1. 和暦必须换算为西暦：令和N年 = 2018+N（令和7年=2025年）；平成N年 = 1988+N（平成31年=2019年）；缩写 R7.5.1 → 2025-05-01，H31.4.30 → 2019-04-30。
      2. 常见西暦写法：2025年5月1日 / 2025/05/01 / 2025.05.01 → 2025-05-01。
      3. 小票上的两位年份按 20YY 理解（25.5.1 → 2025-05-01）。
      4. 年份必须 ≥2015；解析出更早年份说明格式判断有误，必须重新判断。

    - 【金额规则】
      1. 日元金额为整数，千分位为逗号：票面「¥1,234,567」输出 1234567。输出纯数字，严禁保留千分位符号或货币符号。
      2. 负数金额（返金、値引き、赤伝）输出负数。
      3. currency：票面为日文票据且无外币标记时输出 "JPY"；票面明确使用外币（如 USD、CNY）时输出对应 ISO 4217 代码。

    - 【消費税规则】
      1. 日本消費税率为 10%（标准税率）与 8%（軽減税率，适用于饮料食品）。同一张票据可能同时存在 8% 与 10% 两档，必须在 detailOfTaxSummary 中分别输出，不得合并。
      2. 内税（税込表示，如「内消費税」「消費税等（内税）」）：总额已含税。外税（税抜表示，「消費税」单列相加）：总额 = 税抜金额 + 消費税。
      3. taxCategory 保留票面原文的税种表述（如「消費税」「内税」「税込」「消費税等」「内消費税」），不翻译、不映射为英文简称。
      4. 小票上「10%対象 ¥xxx」「8%対象 ¥xxx」的金额是该税率的计税对象金额（含税或不含税以票面标注为准），填入 detailOfTaxSummary 的 netTaxableAmount。

    - 【登録番号规则】適格請求書発行事業者登録番号是「T + 13位数字」（如 T8010001140514），通常标注为「登録番号」「登録No.」「事業者登録番号」，常见于店名附近或票据末尾。按票面原样输出（票面含连字符则保留连字符）。若票面只有 13 位法人番号（无 T 前缀），按原样输出该 13 位数字。填入 billFromTaxIdentificationNumber。

    - 【敬语清理规则】billToName（宛名）末尾的敬语「御中」「様」「殿」「各位」不属于名称本身，必须连同其前面的空白一并剔除后输出。
      - 例：「ハイセンスジャパン 株式会社 御中」→「ハイセンスジャパン 株式会社」
      - 例：「田中太郎 様」→「田中太郎」
      - 仅剔除末尾敬语，名称中间的字符不受影响。「上様」整体是宛名时输出「上様」原文。

    - 【明细规则】detailOfGoodsOrServices 逐行提取商品/服务明细：品名（articleName）按票面原样完整提取（含商品编号、规格），数量、单价、金额按票面数字。小票上带「※」「＊」标记的行通常表示軽減税率(8%)对象商品。
  json_schema:
    title: japan_invoice_and_receipts
    type: ARRAY
    items:
      anyOf:
        - type: OBJECT
          properties:
            docType:
              type: STRING
              description: 票据类型：invoice（請求書）或 receipt（領収書・レシート）
              enum:
                - invoice
                - receipt
            page:
              type: ARRAY
              description: 该票据所在的页码列表（从1开始）。跨页票据列出全部页码，如 [2, 3, 4]。
              items:
                type: NUMBER
            invoiceType:
              type: STRING
              description: |-
                票据细分类型：
                  - 'Invoice'：請求書类（docType 为 invoice 时的默认值）。
                  - 'Receipt'：領収書/レシート类（docType 为 receipt 时的默认值）。
                  - 'Credit Note'：赤伝/返金票据，或合计金额为负数时。
              enum:
                - Invoice
                - Receipt
                - Credit Note
            nameOfInvoice:
              type: STRING
              description: 票面标题，按原样输出，如「領収書」「領収証」「請求書」「御請求書」「ご利用証明書」「領収書 RECEIPT」等。日英并记时两者都保留。
            invoiceNumber:
              type: STRING
              description: 发票号码或收据编号。查找「請求書番号」「ご請求番号」「伝票番号」「精算No」「発券No」「レシートNo」「取引No」「No.」「No」等标注。按票面原样输出（含前缀字母/记号则保留）。
            invoiceCode:
              type: STRING
              description: 票据代码/序列号（若票面有独立于 invoiceNumber 的代码类编号）。没有则不输出。
            invoiceDate:
              type: STRING
              description: 开票/交易日期（発行日・取引日・利用日），格式 YYYY-MM-DD（和暦须换算为西暦）。
            dueDate:
              type: STRING
              description: 付款截止日期（お支払期限・支払期日・振込期限），格式 YYYY-MM-DD。
            paymentDueInDays:
              type: NUMBER
              description: 支付账期天数（如「月末締め翌月末払い」等换算的天数，仅票面明确写出天数时输出）。
            totalNetAmount:
              type: NUMBER
              description: 全票不含税合计（税抜金額・小計（税抜））。票面有多个部分时须求和后输出。
            totalAmount:
              type: NUMBER
              description: 含税总金额（合計・ご請求金額・お買上げ合計・税込合計）。
            totalTaxAmount:
              type: NUMBER
              description: 消費税合计金额（消費税・消費税等・内消費税）。8% 与 10% 并存时输出两档税额之和。严禁用 totalAmount 减某项推算，必须取票面明示的税额。
            taxRate:
              type: STRING
              description: 整单单一税率时的税率，`数字%` 形式（如 "10%"、"8%"）。多档税率并存时不输出此字段（在 detailOfTaxSummary 中分档输出）。
            currency:
              type: STRING
              description: 币种 ISO 4217 代码。日文票据无外币标记时输出 "JPY"。
            billToName:
              type: STRING
              description: 收票方（宛名）名称。查找「宛名」「御中」「様」前的名称。末尾敬语（御中・様・殿・各位）必须剔除。手写宛名也要识别。
            billToComposite:
              type: STRING
              description: 收票方的完整地址信息（仅票面明确有收票方地址时输出）。
            billToCountry:
              type: STRING
              description: 收票方所在国家（仅票面地址明确时输出）。
            billToTaxIdentificationNumber:
              type: STRING
              description: 收票方的登録番号/法人番号（票面明确标注时才输出）。
            billFromName:
              type: STRING
              description: 开票方名称。请求书为发行方公司名（常在右上或盖章处）；小票为商家名/店名（常在票头 logo 处，可能含店铺名，如「〇〇株式会社 △△店」按票面原样）。
            billFromComposite:
              type: STRING
              description: 开票方的完整地址信息（住所）。
            billFromCountry:
              type: STRING
              description: 开票方所在国家。日本票据输出「Japan」，仅票面明确为他国时输出对应国名。
            billFromTaxIdentificationNumber:
              type: STRING
              description: 開票方的適格請求書発行事業者登録番号（T+13位数字，如 T8010001140514）或 13 位法人番号。查找「登録番号」「登録No.」标注。按票面原样输出。
            purchaseOrderNumber:
              type: STRING
              description: 注文番号/PO番号（票面明确标注时输出）。
            shipmentNumber:
              type: STRING
              description: 出荷番号/送り状番号/伝票番号（运输类票据，票面明确标注时输出）。
            detailOfGoodsOrServices:
              type: ARRAY
              description: 商品或服务明细列表，逐行提取。
              items:
                type: OBJECT
                properties:
                  articleName:
                    type: STRING
                    description: 品名/商品名/摘要，按票面原样完整提取。
                  description:
                    type: STRING
                    description: 备注（备考栏内容）。
                  quantity:
                    type: NUMBER
                    description: 数量（数量・個数・点数）。
                  unitOfMeasure:
                    type: STRING
                    description: 计量单位（個・本・式・時間 等），票面有才输出。
                  unitPrice:
                    type: NUMBER
                    description: 单价（単価）。
                  netAmount:
                    type: NUMBER
                    description: 该行不含税金额。
                  taxRate:
                    type: STRING
                    description: 该行税率，`数字%` 形式（"8%" 或 "10%"）。票面「※」「＊」标记通常表示 8% 軽減税率。免税/非課税输出 "0%"。
                  tax:
                    type: NUMBER
                    description: 该行税额。
                  grossAmount:
                    type: NUMBER
                    description: 该行含税金额（金額栏为税込时填此处）。
                  orderNumber:
                    type: STRING
                    description: 该行对应的注文番号（票面有才输出）。
                required: []
            detailOfTaxSummary:
              type: ARRAY
              description: 税金汇总列表。8% 与 10% 两档并存时必须分别输出两条，不得合并。
              items:
                type: OBJECT
                properties:
                  taxCategory:
                    type: STRING
                    description: 税种表述，保留票面原文（如「消費税」「内税」「税込」「消費税等」「内消費税」），不翻译不映射。
                  taxRate:
                    type: STRING
                    description: 税率，`数字%` 形式（"8%"、"10%"）。非課税/免税输出 "0%"。
                  netTaxableAmount:
                    type: NUMBER
                    description: 该档税率的计税对象金额（「10%対象」「8%対象」后的金额）。
                  tax:
                    type: NUMBER
                    description: 该档税额。
                required: []
          required:
            - docType
            - page
            - currency
        - type: OBJECT
          properties:
            docType:
              type: STRING
              description: 其他类型内容（空白页、分隔页、非票据页等）
              enum:
                - other
            page:
              type: ARRAY
              description: 所在页码列表（从1开始）。
              items:
                type: NUMBER
          required:
            - docType
            - page
