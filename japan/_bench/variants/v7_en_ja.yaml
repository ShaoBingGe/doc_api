id: 'jp-v7-en-ja'
remark: v3 的英日双语版 — 规则内容与 v3 完全一致，仅把指令语言由中文换成英文，票面术语/示例保留日文原文。用于隔离「prompt 语言」这一单一变量
template_config:
  fill_empty_items: false
prompt_template:
  prompt_format: |-
    **TASK**
    You are an expert at reading Japanese business documents. Extract every Japanese
    invoice (請求書) and receipt (領収書・レシート) found in the supplied document.
    The document may be: a scan of several small receipts pasted onto one sheet,
    a multi-page 請求書, or a single slip.

    **INPUT**
    - PDF or image. Pages may be skewed, rotated, faintly printed, or faded thermal paper.
    - Text is mainly Japanese, sometimes mixed with English.

    **OUTPUT** A JSON array; each element is one document record.

    ═══════════════════════════════════════════════
    PART 1 — SEGMENTATION: what counts as ONE record
    ═══════════════════════════════════════════════
    This is the most important part. Wrong segmentation invalidates the whole record.

    **1. One record = one physically independent slip**
    A slip that has its own issuer, amount and date, with discernible edges, is one record.
    Multiple printed blocks *inside* the same slip (header, line items, payment box,
    both sides of a cut line) are **merged into one record**.

    **2.「領収書/領収証」and its own「明細」are ONE record — never split them**
    When the upper part of the same sheet / same thermal roll says 領収書 or 領収証 and the
    lower part says 領収書明細, ご利用明細, 航空券明細, きっぷの明細 or 明細書 **with the same
    total amount**, emit ONE record: title = 領収書/領収証, amount = the total, and put the
    detail rows inside that record.

    **3.「請求書」vs「請求明細書」— decide by the total**
    - 明細書 has no independent total (only 小計/累計 or a「ページ n / N」continuation mark)
      → **merge into the 請求書**; one record, list all page numbers in `page`.
    - 明細書 has its own total but it **equals** the 請求書 total → **merge into the 請求書**
      (it is the detail face of the same document).
    - 明細書 has its own header (宛名 + 実施店舗/物件名 + 期間) and a total that **differs**
      from the 請求書 total (it is a breakdown component) → **each is its own record**.

    **4. A「請求書 + a stack of attached 領収書」bundle: emit only the 請求書**
    If page 1 is a supplier's formal 請求書/御請求書 (with 請求金額 and 振込先) and the following
    pages are hotel / JR / parking 領収書 and detail sheets attached as evidence for that amount
    → **emit only that one 請求書 record**; mark the remaining pages as other.
    Conversely, if page 1 is an **internal form** (出張旅費精算書 / 交通費明細書 / 経費精算書)
    → mark page 1 as other, and emit **each following 領収書 as its own record**.

    **5. クレジット/QR/iD「売上票」「支払票」「取引伝票（お客様控え）」are not separate records**
    They are the second leaf of the same transaction as the 領収書 directly above them.
    Merge into one record, following the 領収書 (take the proper merchant name from the 領収書,
    not the half-width katakana merchant name on the card terminal slip).

    **6. Always `docType: other` (emit only docType and page) for:**
    internal expense forms (出張旅費精算書 / 交通費明細書 / 経費精算書);
    伝票-type slips and their 控 copies (返品伝票 / 納品伝票 / 受領書);
    作業明細・技術サービス費請求明細 (部品添付用・メーカー控);
    IC card (Suica/PASMO) 利用履歴 printouts; 保険契約証 / WEB契約証;
    リースお支払明細書 / リース契約のご確認書; 予約一覧表; blank pages, separator pages, ads.

    **7. Never de-duplicate by「same amount / same merchant」— two identical slips are two records**
    Two ¥1,400 bus tickets on the same page are two independent records.

    **8. If the backing sheet is itself a slip, emit both the large and the small ones**
    An A4 formal 領収書 used as a backing sheet with smaller receipts pasted on it: emit the
    large one AND every small one.

    **9. Vertical, rotated, edge-clipped and tiny slips must be counted**
    Scan each page in **all four orientations**: vertically-set「領収証 金○○円」, slips rotated 90°,
    and small odd-shaped tickets (green 新幹線/特急券 stubs, 車券, 印紙) each become their own
    record. Never skip one because its orientation or size differs from the rest.

    ═══════════════════════════════════════════════
    PART 2 — COUNTING & ANTI-HALLUCINATION (run before emitting)
    ═══════════════════════════════════════════════
    **1. Two-phase work**: first build an inventory of slips, noting for each
       (position, merchant, total amount, date, unique slip number); close the inventory,
       then convert each entry into JSON. The number of records emitted must equal the
       inventory size — no more, no fewer.
    **2. Every record must be locatable**: you must be able to point at one physical position
       (top-left / middle-right / page 3 lower-left). A record you cannot place must not be emitted.
    **3. Never extrapolate numbers**: slip numbers may only be read off the page. Having read
       NO.008668 you must **not** emit 008669, 008670, …
    **4. Never extrapolate dates**: do **not** generate a day-by-day increasing/decreasing series.
    **5. Duplicate-triple check**: if two records share (merchant, date, total amount), each must
       correspond to a different physical position AND carry a different unique slip number
       (発券No/精算No/伝票番号). If you cannot show that, delete the later one.
    **6. Sanity ceiling**: an A4 collage sheet rarely holds more than 12 independent receipts.
       If your inventory exceeds 12, stop and re-check block by block — it is probably duplication.
    **7. When unsure, emit other**: if you cannot tell whether a block is an independent slip,
       emit `docType:"other"` rather than guessing invoice/receipt.

    ═══════════════════════════════════════════════
    PART 3 — CLASSIFICATION (docType is decided by the printed title)
    ═══════════════════════════════════════════════
    - **receipt**: title contains 領収書 / 領収証 / 領収 / 受領書 / レシート / ご利用証明書 /
      ご利用証明 / 利用証明書 / ご利用明細書 / 利用明細書 / 明細書 / 診療明細・領収書 /
      クレジットカードご利用明細票 / RECEIPT / DETAILED STATEMENT.
      An **untitled retail slip** (just shop name + items + 合計) is also receipt.
    - **invoice**: title contains 請求書 / 御請求書 / ご請求書 / 請求明細書 / 御請求明細書 /
      見積書 / 御見積書 / 口座振替のお知らせ / 口座振替のご案内 / INVOICE / Information of Current Bill.
    - **Compound titles**:「請求書 兼 領収書」→ invoice;「納品書(領収書)」「領収書兼利用明細書」→ receipt.
      I.e. when both 請求 and 領収 appear, follow whichever is the main (leading) title.
    - **other**: see Part 1 rule 6.

    ═══════════════════════════════════════════════
    PART 4 — FIELD EXTRACTION RULES
    ═══════════════════════════════════════════════
    - Keep the source text as printed (Japanese stays Japanese). Do not translate.
    - **Extract everything the page actually shows**; omit a field only when the page truly
      lacks it. Never infer or invent.

    **[DATES]** always output YYYY-MM-DD:
      - Convert 和暦: 令和N年 = 2018+N (令和7年=2025); 平成N年 = 1988+N;
        R7.5.1 → 2025-05-01; H31.4.30 → 2019-04-30.
      - 2025年5月1日 / 2025/05/01 / 2025.05.01 → 2025-05-01; two-digit years are 20YY (25.5.1 → 2025-05-01).
      - The year must be ≥ 2015.
      - **When a slip carries several dates, prefer**: ①「発行日」「表示日」「取引日時」「精算時刻」「領収日」;
        ② otherwise「購入日」「利用日」; ③「乗車日」「宿泊日」「対象月」「契約期間」are **not** invoiceDate.
        e.g. a JR slip showing both「表示日 2025年5月21日」and「購入日 2025年5月20日」→ take 2025-05-21.

    **[AMOUNTS]**
      - JPY are integers with comma thousand separators:「¥1,234,567」→ 1234567.
        Output a bare number — no symbols, no separators.
      - **「円」is not the digit 0**:「¥1,300円」= 1300 (not 13000). The trailing 円 is a unit word and
        must never be concatenated into the number. Likewise the 10 of「10%」or「(内税)」must not leak in.
      - Negative values (返金, 値引き, 赤伝) are output as negatives.
      - **totalAmount is the final total**: on a 請求書 take the figure in the
       「御請求金額」「差引き御請求額」「合計金額」box, not a line-item subtotal; when several levels of
        total exist, take the top-level one.

    **[CONSUMPTION TAX]**
      - Rates are 10% (standard) and 8% (軽減税率, food & drink; marked「※」or「＊」on the slip).
      - 内税 (税込 display): the total already includes tax. 外税 (税抜 display): total = 税抜 + 消費税.

    **[REGISTRATION NUMBER — format & exclusivity constraints]**
      **Format**: a 登録番号 is「T + exactly 13 digits」(or hyphenated, e.g. T3-0110-0101-8770, which is
      still 13 digits once hyphens are removed). Anything with fewer than 13 digits, or beginning with
     「〒」instead of「T」, is **not** a 登録番号:
      ·『〒2860106』(7 digits, a postal code) → part of the address; never put it in the tax-ID field;
      ·『T401000113724』(12 digits) → a digit was dropped; re-read it character by character.
      Count the digits after extraction and confirm exactly 13 before emitting.
      **Exclusivity**: a T+13-digit number may **only** go into billFromTaxIdentificationNumber —
      never into invoiceNumber / invoiceCode / shipmentNumber / purchaseOrderNumber; conversely
      invoiceNumber must never be a T+13-digit number.
      **Per-slip isolation**: on a collage page each receipt has its own 登録番号; take it from that
      receipt itself. Self-check: two receipts with different merchant names must not share a 登録番号.

    **[NO FIELD BORROWING ACROSS SLIPS ON A COLLAGE PAGE]**
      Every field of a receipt must come from within that receipt's own boundary. Never borrow a
      neighbouring slip's company name, 宛名, amount or 登録番号.

    **[LINE ITEMS]**
      - The reference annotation only ever uses these sub-fields: articleName / netAmount /
        grossAmount / taxRate / description / tax / orderNumber.
        **Do not emit quantity, unitPrice or unitOfMeasure**, and **never compute an amount as
        quantity × unit price** — always copy a figure printed on the page.
      - **articleName is the product name only**: strip a leading product code + ＊ prefix
        (`202101＊ボンカレーゴールド中辛` → `ボンカレーゴールド中辛`), a leading unit-price
        (`110円普通切手・千鳥` → `普通切手・千鳥`), and label words (`但し）`,『取引内容:』).
        With a multi-column table「品目｜詳細｜…」take only the 品目 column.
        If the printed name is truncated, **copy it truncated — do not complete it**.
        Japanese and English printed side by side are joined with one space (`関税 Total Custom Duty`).
      - **description = the second piece of text beside the name**, and any leading「※」「＊」「*」
        **must be removed**: 備考/摘要 column text (`※実費` → `実費`), a parenthetical after the name
        (`駐車料金（一般）` → name `駐車料金` + desc `一般`), a fare-class sub-label on the same line
        (`駐車料金 B料金 400円` → name `駐車料金` + desc `B料金` + grossAmount 400).
      - **「label : value」information rows are line items too**: inside 内訳/課税対象/旅行内容/
        フライト情報 blocks, when the value is text → articleName = label, description = value
        (`搭乗者名`/`KUTSUMA KYOHEI`); when the value is an amount → articleName = label and the amount
        goes to net/gross (`10%対象` 5450,『課税対象外』127870).
      - **A 領収書's 但し書き / 取引内容 is one line item**: a receipt bearing only a purpose sentence
        still gets one line item; articleName = that sentence verbatim, **keeping「〜として」**
        (`乗車運賃代として`,『高速バス代金として』).
      - **Rows whose amount is 0 or blank are still emitted** (運賃 / 保管料 / その他①② in a fee table)
        with `grossAmount: 0`.
      - **netAmount / grossAmount (important)**:
        · When the row shows **only one amount** (the vast majority of receipts and detail tables)
          → put that same figure into **both netAmount and grossAmount** (identical value, no conversion).
          Do not pick one.
        · When the row shows **both a 税抜 and a 税込/税額** → netAmount = 税抜, grossAmount = 税込,
          tax = the tax (`¥7,700-(税 ¥700-)` → net 7000 / tax 700 / gross 7700).
        · **Never convert**: do not derive netAmount as gross÷1.1 nor grossAmount as net×1.1.
          Only figures printed on the page may be used.
      - **Not line items**: 小計 / 合計 / 料金計 / お預り / お釣り / 釣銭額 / 投入現金 / 現金領収額 /
        お買上点数 / クレジット支払 never go into the line items (their amounts belong to
        totalAmount / totalNetAmount).
      - taxRate is filled only when a rate is printed on that row (`10%`/`8%`);
        **never invent `0%` for a row with no rate marking**.

    **[TAX SUMMARY detailOfTaxSummary]**
      - **0 or 1 entry; emit 2 only when the page really prints both an 8% and a 10% column.**
        Do not split「課税計」「非課税計」「内消費税」into several entries.
      - **If a tax rate is printed anywhere, you must emit an entry — even with no amount**:
       『(消費税10%を含む)』『税10%』『消費税等込み 税10%』『全て消費税10%適用対象』『消費税率10%』
        → emit `[{"taxRate":"10%"}]`.
      - **taxCategory = the bare tax word printed on the page**, stripped of rate, brackets and modifiers:
        `消費税10%対象` → `消費税`; `課税（10%）` → `課税`; `10%税抜対象額` → `税抜`.
        Common values: 消費税 / 内税 / 税込 / 消費税等 / 消費税率 / 消費税額 / 内消費税 / 課税 /
        消費税相当額 / 税抜. **Omit the field when no tax word is printed.**
      - **netTaxableAmount = the amount printed next to that rate, copied verbatim — never converted,
        and never judged as 税抜 or 税込**:『(内税10%対象額 400円)』→ 400;『対象合計 7,600円』→ 7600;
       『10%対象 6,132,435』→ 6132435.
      - **Convert only when no target amount is printed at all, and keep two decimals**: with only
       『消費税は10%です』plus a 税込 total of 1,000 → `netTaxableAmount: 909.09`, `tax: 90.91`
        (do not output the integers 909/91).
      - **tax = the tax figure printed on the page** (『内消費税 690円』→ 690). Never back-compute it
        as target × rate.
  json_schema:
    title: japan_invoice_and_receipts
    type: ARRAY
    items:
      anyOf:
        - type: OBJECT
          properties:
            docType:
              type: STRING
              description: Document type — invoice (請求書 family) or receipt (領収書・レシート family), decided by the printed title.
              enum:
                - invoice
                - receipt
            page:
              type: ARRAY
              description: Page numbers this document occupies (1-based). For a document spanning pages, list them all, e.g. [2, 3, 4].
              items:
                type: NUMBER
            invoiceType:
              type: STRING
              description: |-
                Sub-type: use 'Invoice' when docType=invoice; 'Receipt' when docType=receipt;
                'Credit Note' for 赤伝/返金 slips or when the total is negative.
              enum:
                - Invoice
                - Receipt
                - Credit Note
            nameOfInvoice:
              type: STRING
              description: |-
                The printed title, **copied verbatim, character for character**:
                - Compound titles are kept whole:「利用明細書(お客様控え)兼領収書」「請求書 兼 領収書」「納品書(領収書)」.
                - Spaces inside the title are preserved (「領 収 証」).
                - When an English gloss is printed under the Japanese title (「領収書 RECEIPT」,
                 「明細書 DETAILED STATEMENT」), keep both.
                - Distinguish 領収書 from 領収証, and 請求書 from 請求明細書 — use exactly what is printed;
                  never substitute one for the other.
                - When the upper and lower halves of one slip carry different titles (e.g. 領収書 above,
                  ご利用明細書 below), take the **main title** (the larger one, at the top of the slip).
            invoiceNumber:
              type: STRING
              description: |-
                The document number. **Emit the number body only; strip label prefixes** —
                「No.」「NO.」「№」「精算No.」「領収No.」「発券No.」「レシートNo.」「伝票番号」「取引No.」
                never form part of the value.
                e.g.「No.01-000061」→ `01-000061`;「精算No.000571」→ `000571`;「No.5806」→ `5806`.
                Letters and hyphens belonging to the number itself are kept (419430-DP, 11856726-1).
                **Priority when a slip carries several numbers**: ① the number on the same line as, or in
                brackets next to, the title (「《領収書》[No. 16]」→ `16`); ② one labelled「請求書番号」
                「ご請求番号」「領収No.」「精算No.」; ③ a machine serial at the foot of the slip
                (NO.008668-style) has the **lowest** priority — do not take it if ① or ② exists.
                **Never**: a 登録番号 (T+13 digits), a phone number, カード番号, 承認番号, 端末番号,
                加盟店取引番号 or barcode digits.
            invoiceCode:
              type: STRING
              description: |-
                A "second number" printed alongside invoiceNumber; emit only when the page really has one:
                ① on parking 領収証, the「券No.」「発券No.」next to the「No.xxx」→ take the digits (`10-790225`),
                   without the prefix; ② the register / receipt serial on a retail slip's date-time line:
                  「レジ 0004」「レジ No.:0002」「#000007」→ take the number body.
                If a number has already been assigned to invoiceNumber, invoiceCode takes the other one.
            invoiceDate:
              type: STRING
              description: Issue / transaction date, YYYY-MM-DD (和暦 must be converted). With several dates, follow the priority rule in the body text.
            dueDate:
              type: STRING
              description: |-
                Payment due date, YYYY-MM-DD.
                ① Take it directly when「お支払期限」「支払期日」「振込期限」is printed.
                ② **When no explicit date is printed but payment terms are, compute the date from invoiceDate**:
                「毎月末日締め 翌月末支払い」「月末締め翌月末払い」→ last day of the month after the invoice month
                (invoiceDate=2025-05-31 → dueDate=2025-06-30);「翌月NN日払い」→ the NNth of next month;
                「当月末払い」→ last day of the current month;「〜日以内」→ invoiceDate + N days.
                For a 請求書 spanning several pages, the terms in the header apply to all of its records.
            paymentDueInDays:
              type: NUMBER
              description: Emit only when the payment terms are themselves stated as a number of days.
            totalNetAmount:
              type: NUMBER
              description: Whole-document net (tax-exclusive) total (税抜金額・小計（税抜）). Sum the parts when the page has several.
            totalAmount:
              type: NUMBER
              description: Tax-inclusive grand total (合計・ご請求金額・お買上げ合計・税込合計). Remember 円 is not a digit 0.
            totalTaxAmount:
              type: NUMBER
              description: Total consumption tax (消費税・消費税等・内消費税). With both 8% and 10% present, emit their sum. Take the printed tax figure; never back-compute from the grand total.
            taxRate:
              type: STRING
              description: The single rate when the whole document has one, as `N%`. With several rates present, omit this and break them out in detailOfTaxSummary.
            currency:
              type: STRING
              description: ISO 4217 code. Emit "JPY" for a Japanese slip with no foreign-currency marking.
            billToName:
              type: STRING
              description: |-
                The recipient (宛名).
                **1. Strip the trailing honorific**:「様」「御中」「殿」「各位」are not part of the name and must be
                removed together with any whitespace before them (「ハイセンスジャパン 株式会社 御中」→
                `ハイセンスジャパン 株式会社`). Only the trailing honorific is removed; characters in the middle stay.
                **2. Blank 宛名**: when the 宛名 box is blank / ruled / carries only a pre-printed「様」, emit「様」.
                Do not leave it empty and do not write「上様」.
                **3. Position**: on a 請求書 it is at the **top left**, followed by 御中/様; on a 領収書 it follows
                the「宛名」「RECEIVED FROM」「お名前」label. The box at the lower right carrying the 登録番号 /
                振込先 is the issuer, not the recipient.
                **4.** A department / attention line printed after the name is kept with the name.
            billToComposite:
              type: STRING
              description: Recipient's full address (emit only when printed), including the 〒 postcode.
            billToCountry:
              type: STRING
              description: Recipient's country code; "JP" for Japan.
            billToTaxIdentificationNumber:
              type: STRING
              description: Recipient's 登録番号 / 法人番号 (emit only when explicitly printed).
            billFromName:
              type: STRING
              description: |-
                The issuer.
                **1. Prefer the legal entity name**: when the page shows both a facility/shop/brand headline and a
                name carrying a legal-entity suffix (株式会社/(株)/有限会社/合同会社/協同組合), take the latter.
                The legal name is usually on the line above or in the same block as the 登録番号, at the foot of
                the slip, or by the seal, and is often set smaller than the headline.
                e.g. headline「アミュプラザ鹿児島駐車場」+ body「登録番号T8340001005089 株式会社JR鹿児島シティ」
                → take「株式会社JR鹿児島シティ」. e.g. headline「ENEOS」+ body「宝扇商事株式会社」→ take the latter.
                **2. Drop the sub-organisation**: a shop / branch / office name following the brand or legal name is
                not part of billFromName and must be removed (put it in billFromComposite): 〜店 / 〜駅前店 / 〜支店 /
                〜営業所 / 〜事業所 / 〜出張所 / 〜センター / 〜郵便局.
                e.g.「Seria 和光市駅前店」→ billFromName=`Seria`, billFromComposite=`和光市駅前店`;
                「SUPER MARKET TAJIMA 武蔵浦和白幡店」→ `TAJIMA`;
                「ジェイアール四国バス株式会社 徳島支店」→ `ジェイアール四国バス株式会社`.
                **3. Never take the 宛名**: the name pointed to by「宛名」「RECEIVED FROM」「御中」「様」is the
                recipient and must never be placed here.
                **4. No third parties**: 家主 / 管理会社 / 仲介会社 / the company owning a 加盟店取引番号 is not the issuer.
                **5. Same-slip sourcing**: on a collage page take it from that receipt itself; never carry over a name
                from a neighbouring receipt or from the large backing slip.
                **6. Bilingual**: when an English legal name follows the Japanese one, keep both
                (「東海旅客鉄道株式会社 Central Japan Railway Company」).
                **7. Half-width katakana** merchant names (ﾆﾂﾎﾟﾝ ﾕｳﾋﾞﾝ) are converted to full-width (ニッポンユウビン).
            billFromComposite:
              type: STRING
              description: |-
                Issuer's address.
                **1. Prefer the full address, and it must include the postcode with the「〒」symbol itself**:
                「〒2860106 千葉県成田市取香263-1」→ emit the whole string including 〒; never emit only the tail.
                Join all address lines (〒 / prefecture / building / floor / department). A trailing department
                name (東日本営業本部SP2部) stays part of the string.
                **2. When no address is printed, fall back to the issuer's sub-identifier** (do not leave it empty):
                shop / branch name (和光市駅前店, ダイソー和光店), office name (保守管理事業所), the issuing station
                or machine on a transport ticket (広島駅N33発行, 阿南駅), an in-facility location (南ウイング3F).
                **3. Never**: a bare phone number, FAX, opening hours or URL must not be used as this field
                (if only「TEL048-424-3668」is printed and there is no address, use the shop name instead).
                A TEL embedded inside an address string may stay with the address.
            billFromCountry:
              type: STRING
              description: Issuer's country code. Emit "JP" for Japanese documents (not "Japan").
            billFromTaxIdentificationNumber:
              type: STRING
              description: |-
                The issuer's 適格請求書発行事業者登録番号 (T + 13 digits, e.g. T8010001140514; keep hyphens if printed)
                or a 13-digit 法人番号. Look for the「登録番号」「登録No.」「事業者登録番号」label, usually near the
                shop name or at the foot of the slip.
                **Exclusive**: a T+13-digit number may only go here, never into invoiceNumber / invoiceCode.
                **Per-slip**: on a collage page take it from that receipt itself; never mix slips.
                When a document carries several 登録番号 (管理会社 / 仲介会社), take the one belonging to billFromName.
            purchaseOrderNumber:
              type: STRING
              description: 注文番号 / PO番号 (emit only when explicitly printed).
            shipmentNumber:
              type: STRING
              description: 出荷番号 / 送り状番号 (transport documents; emit only when explicitly printed).
            detailOfGoodsOrServices:
              type: ARRAY
              description: Line items. See the [LINE ITEMS] rules in the body. Do not emit quantity / unitPrice / unitOfMeasure.
              items:
                type: OBJECT
                properties:
                  articleName:
                    type: STRING
                    description: The product name only (strip product-code / unit-price / label prefixes; copy truncated names as printed; join a side-by-side English gloss with a space).
                  description:
                    type: STRING
                    description: The second piece of text beside the name (備考/摘要 column, parenthetical, fare-class sub-label, tax-class marking). A leading「※」or「＊」must be removed.
                  netAmount:
                    type: NUMBER
                    description: |-
                      Row net amount. When the row prints only one figure, put that same figure into BOTH netAmount
                      and grossAmount (identical, no conversion); when the row prints both 税抜 and 税込, this is the
                      税抜 one. Never derive it from grossAmount.
                  grossAmount:
                    type: NUMBER
                    description: |-
                      Row gross amount. When the row prints only one figure, it equals netAmount; when the row prints
                      both 税抜 and 税込, this is the 税込 one. Rows whose amount is 0 still emit 0. Never derive it
                      from netAmount.
                  taxRate:
                    type: STRING
                    description: Row tax rate as `N%` (a「※」「＊」marking usually means the 8% 軽減税率). Leave it out when no rate is printed on the row; never invent "0%".
                  tax:
                    type: NUMBER
                    description: Row tax amount (only when printed).
                  orderNumber:
                    type: STRING
                    description: The 注文番号 for that row (only when printed).
                required: []
            detailOfTaxSummary:
              type: ARRAY
              description: |-
                Tax summary. **0 or 1 entry; 2 only when the page really prints both an 8% and a 10% column** —
                do not split「課税計」「非課税計」「内消費税」into several entries.
                **If a rate is printed anywhere, an entry must be emitted even with no amount** (e.g. `[{"taxRate":"10%"}]`).
              items:
                type: OBJECT
                properties:
                  taxCategory:
                    type: STRING
                    description: |-
                      The **bare** tax word printed on the page, stripped of rate / brackets / modifiers:
                      `消費税10%対象`→`消費税`; `課税（10%）`→`課税`; `10%税抜対象額`→`税抜`.
                      Common: 消費税 / 内税 / 税込 / 消費税等 / 消費税率 / 消費税額 / 内消費税 / 課税 /
                      消費税相当額 / 税抜. **Omit the field when no tax word is printed.**
                  taxRate:
                    type: STRING
                    description: Rate as `N%` ("8%", "10%"). 非課税 / 免税 → "0%".
                  netTaxableAmount:
                    type: NUMBER
                    description: |-
                      The amount printed next to that rate, **copied verbatim — never converted, and never judged
                      as 税抜 or 税込** (『対象合計 7,600円』→7600;『10%対象 6,132,435』→6132435).
                      Convert from a 税込 total only when no target amount is printed at all, **keeping two decimals**
                      (1000 税込 → 909.09).
                  tax:
                    type: NUMBER
                    description: The tax figure printed on the page (『内消費税 690円』→690). Never back-compute as target × rate. When converting, keep two decimals (→90.91).
                required: []
          required:
            - docType
            - page
            - currency
        - type: OBJECT
          properties:
            docType:
              type: STRING
              description: Content that is not an independent slip (internal expense forms, 伝票 copies, IC-card histories, contracts, blank/separator pages).
              enum:
                - other
            page:
              type: ARRAY
              description: Page numbers (1-based).
              items:
                type: NUMBER
          required:
            - docType
            - page
