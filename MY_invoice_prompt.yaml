id: '7_16'
remark: "Gemini JSON schema, anyof. (1) Classify card/cash slips as receipts, bank card transaction rows as other, extract Reference No for fuel tickets, prioritize MYR for multi-currency, and complete nameOfInvoice/unitPrice. (2) Bahasa Malaysia document compatibility: Malay title/field label mapping, Malay month/date parsing, and Malay units of measure; keep field names in English and field values in original Malay. (3) Reclassify quotations (SEBUTHARGA/QUOTATION) as other to prevent double accounting; (4) \"Different title = different document\" takes precedence over content-based merging; (5) Strictly forbid using 0 for missing values (no tax line must not have tax=0); clarify ambiguities for Deskripsi/Rujukan Kami/Bil. headers and RA-class business registration numbers. (6) Tighten Tax Invoice criteria: must have **title text** containing TAX INVOICE/INVOIS CUKAI; Sales Tax Reg No or SST columns alone do not constitute evidence. (7) Expand BRN self-inspection to **old numbers in parentheses** (6-7 digits + letter), listing high-frequency confusion pairs like 8↔6, 3↔8, 1↔7 (e.g., stably misread as 1298487-V → 1296487-V after schema hard constraints were enabled); old self-check only covered 12-digit new numbers."
structure_prompt_version: '6'
# ⚠️ This template's **field-level rules live in the schema `description`
# fields as the single source of truth** (layered slimming project, see
# docs/plan-my-template-slimming.md). The body text only keeps: document
# splitting, the three-way adjudication layer, global facts (language/
# currency/date), and output discipline.
# **Depends on PASS_SCHEMA_TO_MODEL=true**: when the switch is off,
# descriptions are never sent to the model and every migrated rule silently
# stops working. Confirm the switch is true before deploying;
# providers without response_schema support (qwen) get the descriptions
# rendered as a text appendix by processors/schema_text.py automatically,
# so no rule is lost.
# Country-locked fields (country standard · immutable): recognition rules
# for these are strictly governed by Part 1 and excluded from Part 2
# reflection/optimization scope; customers cannot add/remove/rename/retype
# them in the customization panel.
locked_fields:
  - invoiceNumber                    # invoice number
  - invoiceDate                      # invoice date
  - billFromName                     # issuer name
  - billFromTaxIdentificationNumber  # issuer tax ID
prompt_template:
  prompt_format: |-
    # Task
    Recognize and extract this Malaysian (MY) document (PDF / image), and output a valid JSON according to the JSON Schema below.
    **A single document may contain multiple independent documents** (commonly seen when full-month invoices are scanned into one PDF), a single document may span multiple pages, or the layout might be messy and printed text blurred. First determine "how many" according to §1.0, and then extract them page by page.

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Part 1 · Malaysia (MY) National Global Instructions
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    ## 1.0 Document Splitting — Determine "How Many" First, Then "What Each Is"
    Splitting the wrong number of documents invalidates the entire record. **This step takes precedence over classification and field extraction.**

    ### 1.0.1 One Record = One Physically Independent Voucher
    A voucher with its own issuer, document number, amount, and date counts as one. Multiple sections within the same voucher (header / line items / payment section / signature section) **must be merged into one** and cannot be split.

    ### 1.0.2 Scan Page by Page, Inspect Every Page
    Multi-page documents must be **checked page by page from page 1 to the last page**, without stopping at the cover page.
    Typical scenario: A PDF scans multiple monthly invoices together, with each page having its own `Invoice No.` and `Total` — in this case, every single one must be output; output as many records as there are documents.
    Self-check: If a document has N pages and each page prints a different Invoice No./Total, the output record count should be close to N. Outputting only 1 record is almost certainly a omission and requires going back to re-check.

    ### 1.0.3 Multi-page Single Document vs. Multiple Independent Documents — Determine by "Document Number + Page Marker"
    - **Multi-page single document** (merged into one, `page` lists all page numbers): Subsequent pages are continuations of the previous page, characterized by **`Invoice No.` being identical to the first page**, or pages marked with `Page 2 of 5` / `Page: 2/5` / `Muka Surat 2/5`, or titled `Attachment to Invoice` / `Continuation`, or containing only continuous line items without an independent total.
    - **Multiple independent documents** (each is an individual record): Each page has a **distinct** `Invoice No.` and its own independent `Total` / `Total Payable` / `GROSS` total.
    - Priority for judgment: **Compare Invoice No. first** (different numbers mean different documents), then check page markers, and finally check whether there is an independent total.

    ### 1.0.4 Multiple Receipts on a Single Page
    When multiple receipts/invoices are pasted vertically on the same page, output a separate record for each; `page` should be filled with that page number.
    Do not merge or deduplicate due to identical merchants or identical amounts — two identical amounts are still two separate records.

    ### 1.0.5 Attachments and Non-document Pages
    Delivery orders, packing lists, statements of account, terms pages, and blank pages attached after an invoice, if **they do not constitute an independent payment voucher**, should be marked as `docType: other` (outputting only docType and page); do not merge them into the invoice, nor omit them from output.

    The following contents, even if they contain card-swiping terms, must be classified as `other`, and **must not** be treated as receipts:
    - **Single transaction records in bank card / e-wallet statements**: Characterized by having only a single line of "Date + Merchant Name + Amount", amounts often carrying a minus sign (such as `-RM 100.00`) or marked with `Transaction Date:`, with **no merchant header section, no line items, no total row, and no document number**. It is a single line of a statement, not a voucher issued by a merchant.
    - **Statements of Account / Transaction History Tables**: Full pages of tabulated multi-row histories; even if each row has an amount, they are not split into multiple vouchers.

    ### 1.0.6 Inventory Before Output
    Before outputting the JSON, mentally list the manifest of "page number - document number - total amount", and then convert them into records one by one; **the record count must equal the manifest item count**. Every record must be traceable to a specific page; if it cannot be traced, do not output it, nor fabricate document numbers or amounts not present on the document.

    ### 1.0.7 Different Title = Different Document (**Takes Precedence Over** "Merge If Content is Identical")
    When judging whether two pages are the same document, **the priority of the title is higher than content similarity**:
    - Different titles across two pages (e.g., page 1 is `SEBUTHARGA`, page 2 is `INVOIS`; or `QUOTATION` vs `INVOICE`; or `DELIVERY ORDER` vs `INVOICE`) → **Must be two independent documents, each forming its own record**, **even if** the line items, unit prices, quantities, and total amounts are **completely identical**, and **even if** `Rujukan Kami` / `Our Ref` / reference numbers are identical on both pages.
    - Merchants putting "quotation + formal invoice" or "delivery order + invoice" into the same PDF is common practice, and content across two pages naturally matches — **consistent content is entirely normal and does not constitute a reason for merging**.
    - Only when titles are identical or subsequent pages have no title, and all features of §1.0.3 are met (same `Invoice No.`, `Page 2 of N` marker, continued line items without an independent total), should they be merged into a multi-page single document.
    - **Exception to this rule — e-Invoice summary page + formal invoice**: The LHDN e-invoice summary page (title `E-INVOICE`, characterized by: `e-Invoice code` / `Unique Identifier No.` / Supplier TIN section) and its subsequent format page with the **same document number** (such as `ORIGINAL` / `TAX INVOICE` headings) are **two representations of the same invoice** — merge them into one, `page` lists both pages, and fields take the union of both pages (TIN/date from the summary page + line items from the format page).
    - Self-check: If you intend to merge two pages into one, first answer: "Are the title words of these two pages literally identical?" — If not, **they cannot be merged**.

    ## 1.1 Document Type Classification (docType + invoiceType)
    - **invoice**: Formal payment voucher. **Only formal vouchers possessing simultaneously "Buyer's header + Supplier tax ID (TIN/SST) + explicit tax amount row" are classified as invoice**; headings written as `TAX INVOICE` with SST/tax amounts are classified as invoice.
      The following subtypes are all classified as invoice (even if their names contain quotation, credit, proforma, etc.):
      - Commercial Invoice (standard invoice, default subtype)
      - Proforma Invoice (document contains keywords like PROFORMA / PRO FORMA)
      - Credit Note (document contains keywords like AVOIR / CREDIT, or totalAmount < 0)
      - Tax Invoice: **The criterion is that the document title text** contains `TAX INVOICE` / `INVOIS CUKAI` / `Faktur Pajak`. **Sales Tax Registration Numbers alone do not constitute evidence** — `Sales Tax Reg No` / `No. Cukai Jualan` / `SST ID` are the seller's tax registration information, and many ordinary invoices titled simply `INVOICE` also print them; if the title is `INVOICE`, classify it as Commercial Invoice; do not upgrade it to Tax Invoice just because a tax number, SST, or TAX column appears on the document.
      - Debit Note
      - Receipt/Tax Invoice: Receipts containing tax information (such as SST/TIN) are classified as invoice.
      - **Exception: Quotations do not belong to invoices**, see §1.1.1 below.
    - **receipt**: Small-amount payment vouchers, generally without detailed tax information, such as various slips and receipts.
      - **Card payment slips and cash register receipts**: Card payment slips / POS receipts from Malaysian gas stations, convenience stores, and restaurants, **even if printed with `INVOICE` / `Current Invoice`**, are strictly classified as receipt.
      Identification features (meeting any two qualifies it as a receipt):
      - Narrow strip format (cash register / POS printed), vertical fields, dot-matrix or thermal printing.
      - Contains card payment fields: `Card Name` / `Terminal` / `Site Id` / `Auth Code` / `App ID` / `App Crypt` / `Approved` / `Verification` / `Seq. Number`.
      - Contains fueling terms such as `Pump` / `FuelSave` / `BUDI95` / `Subsidy` / `Litr` / `ltr`.
      - **No buyer information** (no Bill To / Customer / MESSRS header).
      - No independent tax breakdown table.
    - **Handwritten / preprinted cash receipt books**: Cash receipts with preprinted tables and manually filled amounts are classified as receipts; **do not classify them as invoices just because they have a serial number**. Identification features: heading `CASH BILL` / `BILL` / `RESIT` / `INVOICE` (preprinted), preprinted serial number in the top right corner (e.g., `No. 10206`); column headers `Butir-Butir / Particulars`, `Kuantiti / Quantity`, `Harga / Unit Price`, `Nilai / Amount`; bottom signature section `Terima Oleh / Received By`, `Disahkan Oleh`; handwritten content, no tax ID, no buyer company info, no tax breakdown.
      - Criterion: A true receipt must possess "**merchant header + at least one consumption line item + a total amount**"; lacking any of these three means it is not a receipt (mostly other, see §1.0.5).
    - **other**: Contracts, order confirmations, **quotations**, statements of account, billing logs, and other documents that do not belong to invoices/receipts (see §1.0.5, §1.1.1).

    ### 1.1.1 Quotations Must Be Classified as Other (Preventing Double Accounting)
    **Documents titled `SEBUTHARGA` / `SEBUT HARGA` / `QUOTATION` / `QUOTE` / `报价单` must be classified as `docType: other`** (outputting only docType and page), even if they possess all invoice elements such as supplier, customer, line items, amounts, and even seals/signatures.

    Reason: A quotation is an **offer before transaction completion**, not a payment voucher. In practice, merchants often put "quotation + formal invoice" in the same PDF (with identical amounts on both pages); if both are classified as invoice, downstream reconciliation will **count the exact same money twice**.

    Identification anchors (hitting any means a quotation):
    - Title box reads `SEBUTHARGA` / `SEBUT HARGA` / `QUOTATION`;
    - Main text contains offer wording like `mengemukakan sebut harga` (submitting quotation), `harga yang ditawarkan` (offered price), `Sekiranya terdapat sebarang perubahan ... harga ... akan turut berubah` (prices are subject to change);
    - Document number has a prefix like `QUO` / `QT` / `SH` (such as `QUO-(07/26)(2)`) and the full text lacks any `No. Invois` / `Invoice No`.
    - **Counter-evidence**: If the same page contains another explicit `No. Invois` / `Invoice No.` and the title is `INVOIS` / `INVOICE`, then it is an invoice and this rule does not apply.

    **Relationship with multi-page merging**: Quotation pages and invoice pages, **even if content is identical and reference numbers match** (commonly identical `Rujukan Kami`), are **not** a multi-page single document — different titles mean two separate documents, each forming its own record (the quotation record is other). See §1.0.3 and §1.0.7 for details.

    ## 1.2 Content and Format Uniform Requirements
    - **Language**: MY documents are predominantly in English, with some or **entire pages** using Bahasa Malaysia (Malay). **Keep field values in the original document without translation** — Malay content is output as-is (such as product name `NASI LEMAK BUNGKUS`, merchant name `KEDAI RUNCIT MAJU`), while the output JSON **field names** remain English schema fields. For Malay title-to-document type rulings, see §1.36; field-level label mappings are in each field's description.
    - **Currency**: Default is MYR / RM.
      - Thousands separator `,` + decimal point `.` (same as USD/CNY/GBP): `6,000.00` → actual value `6000.00`; `1,234,567.89` → `1234567.89`.
      - Pay attention to distinguishing Vietnamese VND / certain European formats (`.` as thousands separator, `,` as decimal point) — if VND or similar indicators appear or numerical patterns are clearly opposite, parse according to opposite rules.
      - **Output uniformly as pure numeric strings/values, strictly forbidding thousands separators or currency symbols.**
      - **Multi-currency documents prioritize MYR**: When both foreign currency and Malaysian Ringgit amounts are listed on the document (typical example: overseas platforms issuing receipts to Malaysian customers, such as `GRAND TOTAL USD 54.98` and `Total Charge MYR 224.97 (USD 54.98)`): `currency` takes **MYR**, and `totalAmount` takes **the value of the Malaysian Ringgit row** (in the above example, `224.97`, not `54.98`). Criterion: MYR amounts usually appear on the `Total Charge` / `Amount Charged` line, which is the **actual deducted amount**; the foreign currency line is merely a pricing currency.
        When the document has only a single foreign currency and completely lacks a MYR line, output in the original currency without conversion.
    - **Tax Rate**: Output as a percentage string, such as `"6%"`, `"10%"`.
    - **Date Processing (Absolute rule, must be strictly followed)**:
      1. **Core principle: Year must be ≥ 2025**. Any result parsed as < 2025 (such as 2024/2012/2006) must be corrected, and years/dates cannot be later than the current date.
      2. **Ambiguity resolution**: MY predominantly uses `DD-MM-YYYY`; encounter two-digit years like `07-09-24` and filter according to the above year principles; in the rare event of easily confused formats like "YY-MM-DD" / "MM-DD-YY", back-calculate using the current year-month and related page context, choosing the reasonable date closest to the current date.
      3. **Output format**: All date fields **uniformly use YYYY-MM-DD**.

    ## 1.3 Three Types of MY Numbers — Strict Prohibition of Misuse (Adjudication Layer)
    MY documents often display three types of numbers simultaneously, with completely different field ownership; mixing them up is an error:
    - **TIN** (`C` + 10 digits, e.g., `C5884056070`) → Only goes to billFrom / billTo TaxIdentificationNumber (supplier goes to From, buyer goes to To);
    - **SSM Registration Number** → Only goes to billFromBusinessRegistrationNumber (**supplier only**). Forms: New 12-digit pure numeric (`199201000276`), old (`518287-T`), enterprise-style (`RA0085780-K`); **when old and new are listed side-by-side, retain the full original text** (`199701009372 (424868-V)` output as a whole string, do not take only one half);
    - **SST Number** (`Sales Tax No.` / `SST ID` marker) → **No corresponding output field exists**, absolutely do not fill into invoice number, TIN, or registration number.
    Keywords, format validation, digit-by-digit verification, and forbidden lists for each number are subject to the description of the corresponding field in the schema (invoiceNumber / bill*TaxIdentificationNumber / billFromBusinessRegistrationNumber).

    ## 1.36 Bahasa Malaysia Document Compatibility
    Documents may entirely or partially use Bahasa Malaysia. **JSON field names remain unchanged (still English schema fields), and field values copy the original Malay text from the document without translating to English**.
    Field-level Malay label comparisons (document number/date/amount/tax/item column headers/parties/document chains) are provided in each field's description; extract according to field instructions.

    ### 1.36.1 Titles and Document Types (docType / invoiceType / nameOfInvoice)
    - `INVOIS` = Invoice; `INVOIS CUKAI` = Tax Invoice — the threshold for classifying as invoice is identical to the English version §1.1 (buyer header + supplier tax ID + explicit tax amount row), and is neither relaxed nor tightened because of language.
    - `RESIT` / `RESIT RASMI` (official receipt) / `BIL` / `BIL TUNAI` (cash bill) → receipt cues; the criterion remains the three elements of §1.1 ("merchant header + line items + total").
    - `NOTA KREDIT` → invoiceType = Credit Note; `NOTA DEBIT` → Debit Note (classified under invoice).
    - `INVOIS PROFORMA` → Proforma Invoice; `SEBUT HARGA` (quotation) → treated according to English Quotation rules (only classified as invoice if core elements are present).
    - `PENYATA` / `PENYATA AKAUN` (statement of account) → **other** (corresponding to Statement in §1.0.5).
    - **`nameOfInvoice` copies the original Malay text** (such as `RESIT RASMI`, `INVOIS CUKAI`) without translation; **`invoiceType` enum values still output in English** (Tax Invoice / Credit Note...) — classification conclusions use English enumerations, while original document titles go into nameOfInvoice, each serving its purpose.

    - Dual identity of `Bil.`: When appearing in the **title position**, it represents document type (cash bill, see above); when appearing in the **item table column header**, it represents row sequence number (abbreviation of Bilangan) — interpret meaning based on its location.

    ## 1.4 Required Fields and Missing Handling
    - **invoice / receipt types**: `docType`, `invoiceType`, `page`, and `currency` must be output; if the document lacks currency, infer based on MY context (defaulting to MYR).
    - **other type**: Only `docType` and `page` must be output.
    - **Missing information**: Fields that cannot be found must be left unoutput; **do not infer, do not fabricate**.
    - **Strictly forbid using 0 to represent "absence"**: When the document **has no tax row**, `totalTaxAmount` and `detailOfTaxSummary` must be **left blank / unoutput**, do not fill in `0` — `0` is an assertion that "tax amount is truly zero", which is completely different from "the document never mentioned tax".
      Similarly applicable to `totalNetAmount`, `quantity`, `unitPrice`, and all other numeric fields: **if it cannot be found, do not output it, and never use 0 as a placeholder**.

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Part 2 · Field Recognition Rules
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    Each field's `description` in the JSON Schema below already contains:
    - Business meaning of the field
    - Common keywords and typical formats on MY documents
    - Extraction location anchors
    - Identification points for easily confused fields
    - Extraction methods for numeric fields (such as tax amount priority semantic matching / strict prohibition of estimation)

    **Strictly extract according to each field's description in the schema.**

    > Note: Field recognition rules ("where to look, what to look for") are handled by this Part 2 + schema description; output assembly rules ("how to assemble into JSON once found") are unified under Part 3 Platform Contract.

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Part 3 · Output Contract and Assembly Rules
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    > This part is uniformly managed by the platform and forcibly injected at runtime by the composer from `backend/app/ocr_optimizer/assets/global_output_contract.yaml`. No specific rules are duplicated in this yaml to prevent bidirectional maintenance drift.
    >
    > Covers:
    >   3.1 Top-level ARRAY structure
    >   3.2 Unified numeric field standards (remove thousands separators, remove currency symbols, preserve precision)
    >   3.3 Tax amount assembly (detailOfTaxSummary array + total tax consistency + ADJUSTMENT balancing)
    >   3.4 Line item assembly (one row per item + qty×price check < 1% + PO/SO/DO header/line mutually exclusive)
    >   3.5 Cross-page assembly (merge into single element + page array)
    >   3.6 Credit Note assembly (originalInvoiceReferences mandatory)
    >   3.7 Missing field handling (not found means not output, strict prohibition of inference/fabrication)
    >   3.8 Field output order (reserved)
    >
    > National-level special cases (such as MY currency thousands separator convention) are written in Part 1.2 as "input-side facts" to provide parsing basis for Part 3 platform rules.
    > This country has no Part 3 special case overrides.

  json_schema:
    title: "invoice_and_receipts"
    type: "ARRAY"
    items: 
      anyOf:
        - type: OBJECT
          properties:
            docType:
              type: "STRING"
              description: |-
                Document type: invoice or receipt.
                **Quotations (SEBUTHARGA / SEBUT HARGA / QUOTATION) are excluded and classified as other**
                (Rule reference Part 1.1.1: Quotations are pre-transaction offers, not payment vouchers,
                and matching formal invoice amounts in the same PDF would cause double accounting).
              enum:
                - invoice
                - receipt
            page:
              type: "ARRAY"
              description: "List of page numbers in the document (starting from 1). Note: A single voucher may span multiple pages, and these consecutive page numbers should be output together as an array. Example: When a voucher appears from page 2 to page 4, output [2, 3, 4]."
              items:
                type: "NUMBER"
            invoiceType:
              type: "STRING"
              description: |-
                Invoice type, categorized into:
                  - 'Commercial Invoice': Default type, unless classified as 'Proforma Invoice' or 'Credit Note'.
                  - 'Proforma Invoice': If the document contains keywords like "PROFORMA", "PRO FORMA", "Záloha", "Facture d'Avance", "Prepayment", "Vorkassenrechnung".
                  - 'Credit Note': If the document contains keywords like "AVOIR", "CREDIT", or totalAmount < 0.
                  - 'Tax Invoice': **Only when document title text** is "TAX INVOICE" / "INVOIS CUKAI" / "Faktur Pajak".
                    **Sales Tax Registration Numbers alone do not constitute evidence**: `Sales Tax Reg No` / `No. Cukai Jualan` / `SST ID` are seller tax registration info, and ordinary invoices titled simply `INVOICE` also print them; do not upgrade based on TAX or SST columns in line items either — those are tax columns, not titles.
                    Titles written only as `INVOICE` → classify as 'Commercial Invoice'.
              enum:
                - Commercial Invoice
                - Proforma Invoice
                - Credit Note
                - Tax Invoice
            nameOfInvoice:
              type: "STRING"
              description: |-
                Document Title: **The title text originally printed** on the document, preserving original casing and text without translation.
                Common values: INVOICE, TAX INVOICE, Receipt, CASH BILL, Current Invoice, RESIT, Bill;
                Malay titles copy original text: INVOIS, INVOIS CUKAI, RESIT RASMI, BIL TUNAI, NOTA KREDIT.
                Titles may be centered at the top of the document, below the merchant name, or above the line items.
                Leave blank only when the document genuinely has no title text; **do not use invoiceType values to fill in**.
            invoiceNumber:
              type: "STRING"
              description: |-
                Invoice number or receipt number.
                General rule: If not found, look for 'Invoice No', 'No.', 'No' on the document.
                Malaysian invoice supplementary rules: Look for "Invoice No", "No.", "INVOICE NO:", "E INV NO", and Malay labels "No. Invois", "Nombor Invois", "No. Resit", "No. Bil"; typical formats like PT-148862, S-25/10-0059, INV13398, IN2601/1024, 25FC011847; strictly forbid extracting Sales Tax No / SST ID / No. Cukai Jualan as invoice numbers.
                Extraction priority for fuel/card slips: Look first for explicitly marked document numbers — "Invoice No" / "Bill No" / "Receipt No" / "Resit No" / "R.No" / "Master Bill" / "Booking No", **prioritize taking it if present**; only when all aforementioned labels are **completely absent** should you sequentially take ① "Reference No" / "Ref No" / "Ref. No" (Malay "No. Rujukan" / "Rujukan Kami" are synonymous) ② "Approval Code" / "Auth Code" (only when even Reference No is missing).
                **Regardless of voucher type, absolutely never take** the following values as invoice numbers: Terminal (terminal number, typically 8 pure digits), Site Id, Site Tran No, Batch No, Card No, Seq. Number, App ID, App Crypt, CDB Ref No.
                Self-check: If two **different** vouchers in the same document appear with the **same** invoice number, it indicates the field was taken incorrectly (mostly misread as Terminal or Site Id) — return to the document to re-extract.
            invoiceCode:
              type: "STRING"
              description: "Invoice type code; if absent, look for invoice serial number, 'Serial', 'Ký hiệu', 'Ký hiệu(Serial)'. 'Mã CQT(Code)' is not an invoice type code."
            invoiceDate:
              type: "STRING"
              description: |-
                Invoice issuing date. Malay labels "Tarikh" / "Tarikh Invois" are synonymous with Date / Invoice Date.
                Malay month names (including abbreviations) → month numbers: Januari/Jan=01, Februari/Feb=02, **Mac=03**, April/Apr=04, Mei=05, Jun=06, Julai/Jul=07, **Ogos/Ogo=08**, September/Sep=09, Oktober/Okt=10, November/Nov=11, **Disember/Dis=12**.
                `hb` is the suffix for days (haribulan): `31hb Mac 2025` → `2025-03-31`; `5 Ogos 2025` → `2025-08-05`.
                Common error reminder: Mac is March, Mei is May, Jun is June. Output uniformly as YYYY-MM-DD.
            totalNetAmount:
              type: "NUMBER"
              description: |-
                Total net amount excluding tax for the entire document.
                Note: Must be the sum of net amounts for all goods/services items. If the document has multiple parts (such as principal and commission), be sure to sum them up before outputting, and do not extract only a portion as the total net amount.
                **When the document has absolutely no tax row** (no SST / no tax breakdown, only a single total),
                the net amount equals that total — fill with the same value as totalAmount, with **the sign matching totalAmount** (negative for Credit Note), **do not leave blank**.
            totalAmount:
              type: "NUMBER"
              description: |-
                Total amount including tax, commonly Total, Grand Total, Total Due, Amount Payable, etc.;
                Malay labels Jumlah / Jumlah Besar / Jumlah Keseluruhan / Jumlah Perlu Dibayar are synonymous (Jumlah Kecil is Subtotal, do not take).
                Tunai (cash) / Baki (change) / Bayaran (payment) lines on receipts are not total amounts — total amounts take the Jumlah / JUMLAH total line.
                **Credit Note sign rule**: When invoiceType=Credit Note, output this field as a **negative value** — even if printed as positive on the document (credit amount convention), take it as negative (document 709.25 → -709.25); totalNetAmount / totalTaxAmount signs must match this field.
                When both foreign currency and Malaysian Ringgit amounts are listed, take **the value of the Malaysian Ringgit (MYR) line** (actual deduction amount, often marked Total Charge / Amount Charged), rules per Part 1.2.
            totalTaxAmount:
              type: "NUMBER"
              description: |-
                Total tax amount. Malay labels: Cukai=Tax, Cukai Jualan=Sales Tax, Cukai Perkhidmatan=Service Tax (combined as SST), CBP (Cukai Barang & Perkhidmatan)=GST.
                **Leave blank/unoutput when the document has no tax rows, strictly forbidden to fill 0**
                (0 means "tax amount is truly zero", which differs from "tax not mentioned on document", see Part 1.4).
                Extraction logic as follows:
                1. **Semantic priority**: Prioritize extracting the sum of values explicitly identified as 'Tax', 'VAT', 'GST', 'IVA', 'Tax Amount', etc.
                2. **Structural recognition**: When a multi-row tax summary table (Tax Summary) exists, extract the sum of amounts for each tax type in the table, rather than taking the 'Total' or 'Subtotal' fields within the table.
                3. **Strictly forbidden estimation**: Strictly forbid estimating tax merely via (TotalAmount - some item), tax item identification must be found on the document.
            currency:
              type: "STRING"
              description: |-
                Currency, output in ISO 4217 currency code form, such as MYR, USD, SGD, CNY, GBP, etc.
                When foreign currency and MYR appear simultaneously, take **MYR** (same currency system as totalAmount, see Part 1.2);
                when unmarked, infer based on MY context, defaulting to MYR.
            billToName:
              type: "STRING"
              description: "Name of the billing recipient. If 'Bill To' is absent, look for 'MESSRS', 'Purchaser', 'Customer', 'Buyer', 'Attention to', Malay 'Kepada' (to), 'Pelanggan' (customer), 'Pembeli' (buyer), or other synonymous terms for purchasing party."
            billToComposite:
              type: "STRING"
              description: "Complete address information of the billing recipient."
            billToCountry:
              type: "STRING"
              description: "Country of the billing recipient, extracted based on the recipient's complete address."
            billToCountryCode:
              type: "STRING"
              description: "ISO 3166-1 alpha-2 country code of the billing recipient's country, such as CN, US, MY, SG, JP, GB, DE, etc."
            billToTaxIdentificationNumber:
              type: "STRING"
              description: |-
                Tax registration number of the billing recipient (buyer).
                Malaysian invoice supplementary rules: Look for "TIN", "TIN No.", "TIN Number", "Supplier TIN", "Buyer TIN", "Customer Tin No."; format must start with "C" + 10 digits (e.g., C5884056070, C4908240100), do not write non-compliant formats into this field; when supplier TIN and buyer TIN appear simultaneously, take only the buyer TIN.
            billFromName:
              type: "STRING"
              description: "Name of the bill issuer. If 'From' information is absent or does not look like a company name, look for: 'Account Name', 'Beneficiary Name', 'Seller', 'Remit to', Malay 'Pembekal' (supplier), 'Penjual' (seller), merchant name at the bottom signature area, title, receipt, or slip."
            billFromComposite:
              type: "STRING"
              description: "Complete address information of the bill issuer."
            billFromCountry:
              type: "STRING"
              description: "Country of the bill issuer, extracted based on the issuer's address information."
            billFromCountryCode:
              type: "STRING"
              description: "ISO 3166-1 alpha-2 country code of the bill issuer's country, such as CN, US, MY, SG, JP, GB, DE, etc."
            billFromTaxIdentificationNumber:
              type: "STRING"
              description: |-
                Tax registration number of the bill issuer (supplier).
                General rule: If not found, look for tax registration number, 'VAT Registration', 'TAX#'.
                Malaysian invoice supplementary rules: Look for "TIN", "TIN No.", "TIN Number", "Supplier TIN", "Vendor TIN", "Seller TIN", "Income Tax No."; format must start with "C" + 10 digits (e.g., C5884056070, C4908240100), do not write non-compliant formats into this field; when supplier TIN and buyer TIN appear simultaneously, take only the supplier TIN. **Strictly forbid writing SST No. / Sales Tax No. / SSM registration numbers as TIN into this field** (SST/SSM have dedicated fields).
            billFromBusinessRegistrationNumber:
              type: "STRING"
              description: |-
                Commercial registration number / registration number / SSM number of the bill issuer (supplier).
                General rule: Extract numbers following Company No. / Co. Reg. No. / Registration No. / Company Reg No. / BRN, noting they may contain old/new numbers, parentheses, hyphens, e.g., 200201024195 or 199501005689 (New).
                Malaysian invoice supplementary rules: Look for "Company Reg.No", "Registration No", "SSM", or 12-digit numbers in parentheses next to company names; typical formats like 199201000276, 199501005689, 518287-T, 199701009372 (424868-V); strictly forbid extracting buyer registration numbers; retain full original text when old and new numbers appear simultaneously.
                Malay label "No. Pendaftaran" / "No. Pendaftaran Syarikat" = Company Registration No., handled similarly.
                Sole proprietorships / partnerships (Enterprise / Perniagaan) have another set of registration numbers: two letters + numbers + hyphen + letter (such as RA0085780-K, PG0123456-A), often **printed directly in parentheses following the company name** (e.g., G CONCEPT EMPIRE (RA0085780-K)) — fill into this field as well, and **must be extracted out from the company name**, leaving billFromName with just the company name itself.
                **Strictly forbid writing Sales Tax No. / SST ID as registration numbers into this field** (SST is sales and service tax number, completely different from SSM registration number).
                **Digit-by-digit verification (most error-prone field)**: Registration numbers often closely follow company names on the same line in smaller font, prone to overlapping/merging with company name strokes in scans. Perform four self-checks after extraction:
                ① Count digits — new numbers minus parentheses/old numbers should equal **12 pure digits**;
                ② First 4 digits are registration year, should be between 1950–current year (e.g., `2007...`);
                ③ **Old numbers inside parentheses must also be verified digit-by-digit** — format is "6-7 digits + hyphen + single letter" (such as `1298487-V`, `518287-T`). Having a smaller font, they are frequently misread; **`8`↔`6`, `3`↔`8`, `1`↔`7`, `0`↔`O` are the highest-frequency confusion pairs**; when in doubt, zoom in on strokes to check closed loops (`8` has two closed loops, `6` has only one lower loop);
                ④ If the number appears in multiple places on the document (header, footer, seal, terms area), **cross-compare to ensure consistency**.
            purchaseOrderNumber:
              type: "STRING"
              description: |-
                Purchase order number.
                General rule: Look for PO number / P/O No / Cust PO / CUSTOMER P/O NO, etc. Extract only if applicable to the entire invoice; if applicable to a specific line item only, leave this field blank and fill into the corresponding line item's purchaseOrderNumber.
                Malaysian invoice supplementary rules: Look for "P/O No.", "Your PO No.", "PO No", "Order No", "Buyer's Order No", "P.O.NO." (header); typical formats like W1 537443, K2 513875, W1 525065, N1 547225, 90001110; usually consists of letter prefix (W1/K2/N1, etc.) + digits, potentially with space separators (e.g., W1 516992), preserve original space formatting upon extraction; when presented in horizontal headers like "P.O.NO. D.O.NO. SALES REP.", PO values typically reside on the second line below headers. Malay label "No. Pesanan" / "Pesanan Belian" = PO No., handled similarly.
            dueDate:
              type: "STRING"
              description: |-
                Payment deadline date. Malay labels "Tarikh Matang" / "Tarikh Akhir Bayaran" are synonymous with Due Date;
                Month spelling (including Malay month names and hb suffix) is identical to invoiceDate description. Output uniformly as YYYY-MM-DD.
            salesOrderNumber:
              type: "STRING"
              description: "Sales order number, such as SO No / S/O No / Sales order / SO#. Extract only if applicable to the entire invoice; if applicable to a specific line item only, leave blank and fill into the corresponding line item's salesOrderNumber."
            deliveryOrderNumber:
              type: "STRING"
              description: |-
                Delivery order number / dispatch note number.
                General rule: Look for Packing slip / D.O.NO. / D/O NO / DO, typical formats like DO-153555, DO251728. Extract only if applicable to the entire invoice; if applicable to a specific line item only, leave blank and fill into the corresponding line item's deliveryOrderNumber.
                Malaysian invoice supplementary rules: Look for "D/O No.", "Our D/O No", "DO NO", "D.O. No.", "REFER D/O", "D.O.NO." (header); typical formats like E-DO00863, DO2601/0543, SH34756, LTA2507250095, T 056331, 90001110; an invoice may contain multiple DO numbers, all must be listed and separated by semicolons ";" into the same field; when presented in horizontal headers like "P.O.NO. D.O.NO. SALES REP.", DO values typically reside on the first line below headers (mostly pure digits). Malay label "Nota Serahan" / "Nota Hantaran" = Delivery Order, handled similarly.
            detailOfGoodsOrServices:
              type: "ARRAY"
              description: "List of goods or services line items, including name, remarks, quantity, unit of measure, unit price, net amount, tax rate, tax, gross amount, order number, sales order number, and delivery order number for each item."
              items:
                type: "OBJECT"
                properties:
                  articleName:
                    type: "STRING"
                    description: |-
                      Name of goods or service (extract complete information).
                      **Regardless of what the column header is named, goods/service names go here**: MY invoice item columns commonly have headers like `Description`, `Item`, `Item Description`, `Particulars`, `Product`, `Descriptions of Goods`, and Malay `Butir-Butir` / `Butiran` / `Perihal` / `Keterangan` / `Deskripsi`, etc. — header wording does not affect ownership; as long as it answers "what is being sold in this row", it goes into articleName.
                      **This field must not be blank as long as the line item contains goods/services.**
                      Example: Header is `Description`, content is `LONGKANG TANAH 6" (WL)`
                      → articleName = `LONGKANG TANAH 6" (WL)` (**not** description).
                  description:
                    type: "STRING"
                    description: |-
                      **Supplementary description / remarks** for this line, used for additional info beyond product names, such as specifications, lot numbers, content in Remark / Notes columns, model descriptions, "c/o so-and-so", etc.
                      **Note: This field does not correspond to the document's `Description` column** — the document's Description column holds product names and belongs in articleName.
                      If the row contains only a single piece of text (which is the product name), leave this field **blank**, do not copy product names here.
                  quantity:
                    type: "NUMBER"
                    description: |-
                      Quantity of goods or services. Malay column header `Kuantiti` / `Kti` = Quantity.
                      Unit column identification: If the row's "quantity/unit price" is split into multiple sub-headers (such as PCS / BDL / MT / CTN / SET), prioritize taking the column corresponding to the **billing unit** (matching unitPrice).
                      Reference check: quantity × unitPrice should approximately equal netAmount (specific consistency thresholds per Part 3.4).
                  unitOfMeasure:
                    type: "STRING"
                    description: |-
                      Unit of measure, such as pcs, kg, m, hour, etc. Malay units copy original text without translation: biji (pieces/grains), keping (sheets/pieces), kotak (boxes), bungkus (packs), botol (bottles), pasang (pairs), helai (sheets/pieces), tin (cans), paket (small packs) — treated equivalently to English pcs/kg.
                  unitPrice:
                    type: "NUMBER"
                    description: |-
                      Unit price of goods or services. Must be filled when the document **prints a unit price column**: common forms include `Price` / `Unit Price` / `Harga` / `Harga Seunit` columns, numbers following `@`, or per-unit prices like `RM3.370/ltr`, `@RM1.380/ltr` (fill 3.370 / 1.380).
                      When quantity is 1 and the document prints only a single amount, unitPrice equals that amount.
                      Leave blank if the document truly has no unit price and cannot be directly read — **do not reverse-calculate via netAmount ÷ quantity** (indivisible divisions introduce false precision).
                  netAmount:
                    type: "NUMBER"
                    description: |-
                      Net amount excluding tax. The rightmost column `Jumlah` (or `Amaun` / `Nilai`) in Malay item tables is the amount for **that specific row**, fill into this field; the single `JUMLAH` row at the table bottom is the **grand total for the entire document**, belonging to totalAmount, not any line item.
                  taxRate:
                    type: "STRING"
                    description: "Tax rate"
                  tax:
                    type: "NUMBER"
                    description: "Tax amount"
                  grossAmount:
                    type: "NUMBER"
                    description: "Gross amount including tax"
                  orderNumber:
                    type: "STRING"
                    description: "Order number"
                  salesOrderNumber:
                    type: "STRING"
                    description: "Sales order number corresponding to this line item, such as SO No / S/O No / Sales order / SO#. Fill in only if the order number corresponds exclusively to this line item; if applicable to all line items on the invoice, leave blank and fill into the invoice header's salesOrderNumber."
                  deliveryOrderNumber:
                    type: "STRING"
                    description: "Delivery order number corresponding to this line item, such as Packing slip / D.O.NO. / D/O NO / DO, typical formats like DO-153555, DO251728. Fill in only if it corresponds exclusively to this line item; if applicable to all line items, leave blank and fill into invoice header's deliveryOrderNumber."
                  purchaseOrderNumber:
                    type: "STRING"
                    description: "Purchase order number corresponding to this line item, such as P/O No / Cust PO / CUSTOMER P/O NO. Fill in only if it corresponds exclusively to this line item; if applicable to all line items, leave blank and fill into invoice header's purchaseOrderNumber."
                required: []
            detailOfTaxSummary:
              type: "ARRAY"
              description: |-
                Tax summary list, including tax category, tax rate, taxable basis, and tax amount.
                A single voucher may simultaneously contain additive taxes (VAT / SST / GST) and subtractive taxes (WHT / Withholding Tax), all must be extracted one by one.
                Cases with the same tax category but different tax rates need to be extracted separately into multiple rows.
                Assembly rules and consistency checks see Part 3.3 (including ADJUSTMENT balancing mechanism).
              items:
                type: "OBJECT"
                properties:
                  taxCategory:
                    type: "STRING"
                    description: "Tax category abbreviation. Prioritize using platform standard abbreviations (VAT/SST/GST/WHT/CIT/CT/IVA/ADJUSTMENT), use original document names if not in the table."
                  taxRate:
                    type: "STRING"
                    description: "Tax rate"
                  netTaxableAmount:
                    type: "NUMBER"
                    description: "Taxable basis (amount subject to tax / net amount excluding tax)"
                  tax:
                    type: "NUMBER"
                    description: |-
                      Tax amount. Extraction principles:
                      1. **Semantic priority**: Prioritize extracting values explicitly identified as Tax / SST / VAT / GST / Tax Amount.
                      2. **Structural recognition**: Extract sum of amounts for each tax category from multi-row tax rate summary tables (Tax Summary), rather than simply taking table-bottom Total / Subtotal.
                      3. **Strictly forbidden estimation**: Do not reverse-calculate tax using totalAmount − item, corresponding tax item identifications must be found on the document.
                required: []
            originalInvoiceReferences:
              type: "ARRAY"
              description: "Original invoice reference list. Extract only when invoiceType is 'Credit Note'; other invoice types keep this field but leave content empty. Multiple original invoice info groups may exist on the document, output each group as an element."
              items:
                type: "OBJECT"
                properties:
                  originalInvoiceCode:
                    type: "STRING"
                    description: "Original invoice code (serial number), do not output if absent on document."
                  originalInvoiceNumber:
                    type: "STRING"
                    description: "Original invoice number."
                  originalInvoiceDate:
                    type: "STRING"
                    description: "Original invoice issuing date, format YYYY-MM-DD."
                required: []
          required:
            - docType
            - invoiceType
            - page
            - currency
        - type: OBJECT
          properties:
            docType:
              type: "STRING"
              description: "Other document types"
              enum:
                - other
            page:
              type: "ARRAY"
              description: "List of page numbers in the document (starting from 1)."
              items:
                type: "NUMBER"
          required:
            - docType
            - page
