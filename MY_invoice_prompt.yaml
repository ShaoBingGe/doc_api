id: '7_8'
remark: gemini json schema, anyof. Design v7 — Part1 (MY country global) + Part2 (defer to schema descriptions) + Part3 (platform output contract reference only; composer injects from assets/global_output_contract.yaml).
structure_prompt_version: '6'
prompt_template:
  prompt_format: |-
    # 任务
    请识别并提取这张马来西亚（MY）票据文档（PDF / 图片），按下方 JSON Schema 输出合法 JSON。
    文档可能包含多张票据、跨页票据、印刷模糊等情况，请尽可能准确识别。

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Part 1 · 马来西亚（MY）国家全局说明
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    ## 1.1 票据种类分类（docType + invoiceType）
    - **invoice**：正式付款凭证，包含供应商和客户信息、发票号码、日期、税务信息、付款条款、商品或服务明细、总金额。
      下列子类型一律归为 invoice（即使名称含 quotation / credit / proforma 等）：
      - Commercial Invoice（标准发票，默认子类）
      - Proforma Invoice（形式发票；票面含 PROFORMA / PRO FORMA 等关键词）
      - Credit Note（贷项发票；票面含 AVOIR / CREDIT 等关键词，或 totalAmount < 0）
      - Tax Invoice（税务发票；票面含 "Tax Invoice" / "Faktur Pajak"，MY 多数 SST 发票属此类）
      - Debit Note（借项发票）
      - Quotation 报价单：若含供应商/客户/明细/金额等 invoice 核心要素，亦归 invoice
      - Receipt/Tax Invoice 收据税票：含税务信息（如 SST/TIN）的归 invoice
    - **receipt**：小额付款凭证，一般无详细税务信息，如各种小票、收据。
    - **other**：合同、订单确认书等不属 invoice/receipt 的文档。

    ## 1.2 内容与格式统一要求
    - **语言**：MY 票据以英文为主，部分中/马来文。**保持原文，不翻译**。
    - **货币**：默认 MYR / RM。
      - 千分位 `,` + 小数点 `.`（同 USD/CNY/GBP）：`6,000.00` → 实际值 `6000.00`；`1,234,567.89` → `1234567.89`。
      - 注意区分越南 VND / 部分欧洲格式（`.` 千分位、`,` 小数点）—— 若票面出现 VND 等标识或数字规律明显相反，按相反规则解析。
      - **输出统一为纯数字字符串/数值，严禁保留千分位符号或货币符号。**
    - **税率**：以百分比字符串输出，如 `"6%"`、`"10%"`。
    - **日期处理（绝对规则，必须严格遵守）**：
      1. **核心原则：年份必须 ≥ 2015**。任何解析出 < 2015（如 2014/2012/2006）的结果一律抛弃。
      2. **歧义消除**：MY 主流为 `DD-MM-YYYY`；遇到 `07-09-24` 这种二位年时按上述年份原则筛选；剩余多个合理解析中取最合理者。
      3. **输出格式**：最终所有日期字段 **统一 YYYY-MM-DD**。

    ## 1.3 MY 税号/税编强制规定
    - **TIN（Tax Identification Number）**：所有 MY 实体的纳税识别号。
      - 格式：`C` + 10 位数字（如 `C5884056070`、`C4908240100`）。
      - 一张票面上若同时出现卖方 TIN 与买方 TIN：
        - 卖方 TIN → `billFromTaxIdentificationNumber`
        - 买方 TIN → `billToTaxIdentificationNumber`
      - 关键词：`TIN`、`TIN No.`、`Supplier TIN`、`Buyer TIN`、`Customer Tin No.`
    - **SSM / Company Reg. No.（业务登记号）**：MY 公司注册号，**仅供应商提取，不取买方**。
      - 格式：12 位纯数字（新号，如 `199201000276`），或旧号带连字符（如 `518287-T`、`424868-V`），或并列（如 `199701009372 (424868-V)`）—— 完整保留原文。
      - 关键词：`Company Reg.No`、`Registration No`、`SSM`，或公司名称右侧括号内的 12 位数字。
      - 字段：`billFromBusinessRegistrationNumber`。
    - **SST Number（销售与服务税号）**：与 TIN / SSM 完全不同，**不要混用**。MY 票面常单独标注 `Sales Tax No.` / `SST ID`。
      - **严禁将 SST 号当作 invoice number / TIN / SSM**。
    - **发票号 invoiceNumber**：
      - 关键词：`Invoice No`、`INVOICE NO:`、`E INV NO`、`No.`
      - 典型格式：`PT-148862`、`S-25/10-0059`、`INV13398`、`IN2601/1024`、`25FC011847`
      - **严禁将 Sales Tax No 或 SST ID 误取为 invoice number。**

    ## 1.4 必填字段与缺失处理
    - **invoice / receipt 类型**：`docType`、`invoiceType`、`page`、`currency` 必须输出；若票面无 currency，按 MY 上下文推断（默认 MYR）。
    - **other 类型**：仅 `docType`、`page` 必须输出。
    - **缺失信息**：无法找到的字段一律不输出，**不要推断、不要捏造**。

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Part 2 · 字段识别规则
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    下方 JSON Schema 中每个字段的 `description` 已经包含了：
    - 该字段的业务含义
    - MY 票面常见关键词与典型格式
    - 取值位置锚点
    - 易混淆字段的辨别要点
    - 数值类字段的取值方法（如税额优先语义匹配 / 严禁推算）

    **请严格按 schema 中每字段的 description 提取。**

    > 说明：字段识别规则（"在哪里找、找什么"）由本 Part 2 + schema description 承担；
    > 输出装配规则（"找到后怎么组装成 JSON"）已统一抽到 Part 3 平台契约。

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Part 3 · 输出契约与装配规则
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    > 本部分由平台统一管理，运行时由 composer 从
    > `backend/app/ocr_optimizer/assets/global_output_contract.yaml`
    > 强制注入。本 yaml 中**不复制具体规则**，避免双向维护漂移。
    >
    > 涵盖：
    >   3.1 顶层 ARRAY 结构
    >   3.2 数值字段统一规范（去千分位、去货币符号、保留精度）
    >   3.3 税额装配（detailOfTaxSummary 数组 + 总税额一致性 + ADJUSTMENT 平账）
    >   3.4 行项目装配（一行一项 + qty×price 校验 < 1% + PO/SO/DO 头/行二选一）
    >   3.5 跨页装配（合并为单元素 + page 数组）
    >   3.6 Credit Note 装配（originalInvoiceReferences 必填）
    >   3.7 缺失字段处理（找不到不输出，严禁推断捏造）
    >   3.8 字段输出顺序（预留）
    >
    > 国家级特例（如 MY 货币千分位约定）写在 Part 1.2 作为"输入侧事实"，
    > 为 Part 3 平台规则提供解析依据。
    > 本国家无 Part 3 特例 override。

  json_schema:
    title: invoice_and_receipts
    type: ARRAY
    items: 
      anyOf:
        - type: OBJECT
          properties:
            docType:
              type: STRING
              description: 票据类型：invoice 或 receipt 
              enum:
                - invoice
                - receipt
            page:
              type: ARRAY
              description: "所在文档中的页码列表（从1开始编号）。注意：一张票据可能跨越多个页面，应将这些连续页码作为一个数组整体输出。例如：票据出现在第2至第4页时，输出为 [2, 3, 4]。"
              items:
                type: NUMBER
            invoiceType:
              type: STRING
              description: |-
                发票类型，分为：
                  - 'Commercial Invoice' (正式发票)：默认类型，若非 'Proforma Invoice' 或 'Credit Note'，则归为此类。
                  - 'Proforma Invoice' (形式发票)：如果票面包含 "PROFORMA", "PRO FORMA", "Záloha", "Facture d'Avance", "Prepayment", "Vorkassenrechnung" 等关键词。
                  - 'Credit Note' (贷项发票)：如果票面包含 "AVOIR", "CREDIT" 等关键词，或 totalAmount < 0。
                  - 'Tax Invoice' (税务发票)：如果票面包含 "'Tax Invoice", "Faktur Pajak" 等关键词。
              enum:
                - Commercial Invoice
                - Proforma Invoice
                - Credit Note
                - Tax Invoice
            nameOfInvoice:
              type: STRING
              description: 票面标题，票面上的标题，如'VAT Invoice'、'Debit Note'等。
            invoiceNumber:
              type: STRING
              description: |-
                发票号码或收据编号。
                通用规则：如果找不到，则查找票面的 'Invoice No'、'請求書番号'、'ご請求番号'、'ﾚシートNo'、'発券No'、'伝票番号'、'No.'、'No'。
                马来西亚发票补充规则：可查找 "Invoice No"、"No."、"INVOICE NO:"、"E INV NO"；典型格式如 PT-148862、S-25/10-0059、INV13398、IN2601/1024、25FC011847；严禁将 Sales Tax No 或 SST ID 提取为发票号。
            invoiceCode:
              type: STRING
              description: 发票类型代码，如果没有发票类型代码信息, 则查找发票序列号、'Serial'、'Ký hiệu'、'Ký hiệu(Serial)'。'Mã CQT(Code)'不是发票类型代码。
            invoiceDate:
              type: STRING
              description: 发票发行日期。
            totalNetAmount:
              type: NUMBER
              description: |-
                全票不含税总净额。
                注意：必须是所有商品/服务项的净额加总。如果票面有多个部分（如本金和佣金），请务必求和后再输出，不要只提取其中一部分的金额作为总净额。
            totalAmount:
              type: NUMBER
              description: 含税总金额，常见为Ukupan iznos fakture、subTotal、total、รำกวนเรียนทั้งสิ้น等。
            totalTaxAmount:
              type: NUMBER
              description: |-
                总税额。提取逻辑如下：
                1. **语义优先**：优先提取明确标识为 'Tax', 'VAT', 'GST', 'IVA', 'Tax Amount' 等字段的数值总和。
                2. **结构识别**：在存在多行税率汇总表（Tax Summary）的情况下，应提取表中各税种金额的加总，而不是提取表中的 'Total' 或 'Subtotal' 字段。
                3. **严禁推算**：严禁仅通过 (TotalAmount - 某个收支项) 简单推算税额，必须在票面找到对应的税金标识。
            currency:
              type: STRING
              description: 币种，以ISO 4217货币代码形式输出，如：USD, CNY, CAD, AUD, GBP, JPY, DEM, HKD, FRF, CHF, VND等。
            billToName:
              type: STRING
              description: 收票方的名称。如果没有'Bill To'，则找'MESSRS'、'Purchaser'、'Customer'、'Buyer'、'Attention to'或其他和'购买方'同义的词语。
            billToComposite:
              type: STRING
              description: 收票方的完整地址信息。
            billToCountry:
              type: STRING
              description: 收票方所在国家，根据收票方的完整地址提取。
            billToCountryCode:
              type: STRING
              description: 收票方所在国家的ISO 3166-1 alpha-2国家代码，如：CN, US, MY, SG, JP, GB, DE等。
            billToTaxIdentificationNumber:
              type: STRING
              description: |-
                收票方（买方）的税务注册码。
                马来西亚发票补充规则：查找 "TIN"、"TIN No."、"TIN Number"、"Supplier TIN"、"Buyer TIN"、"Customer Tin No."；格式必须为 "C" 开头 + 10 位数字（例如 C5884056070、C4908240100），不符合此格式的不要写入该字段；当票面同时存在供应商 TIN 与买方 TIN 时，只取买方 TIN。
            billFromName:
              type: STRING
              description: 开票方的名称。如果没有'From'信息, 或者'From'信息不像一个公司名称，则找：'Account Name'、'Beneficiary Name'、'Seller'、'Remit to'、底部签名处或者标题、收据或小票的商家名称。
            billFromComposite:
              type: STRING
              description: 开票方的完整地址信息。
            billFromCountry:
              type: STRING
              description: 开票方所在国家，根据开票方的地址信息提取。
            billFromCountryCode:
              type: STRING
              description: 开票方所在国家的ISO 3166-1 alpha-2国家代码，如：CN, US, MY, SG, JP, GB, DE等。
            billFromTaxIdentificationNumber:
              type: STRING
              description: 开票方的纳税识别号。如果找不到，则查找税务注册码、'VAT Registration'、'TAX#'。
            billFromBusinessRegistrationNumber:
              type: STRING
              description: |-
                开票方（供应商）的商业登记号 / 注册号 / SSM 号码。
                通用规则：提取 Company No. / Co. Reg. No. / Registration No. / Company Reg No. / BRN 后面的编号，注意可能包含新旧号、括号、连字符，例如 200201024195 或 199501005689 (New)。
                马来西亚发票补充规则：查找 "Company Reg.No"、"Registration No"、"SSM"，或公司名称旁括号内的 12 位数字；典型格式如 199201000276、199501005689、518287-T、199701009372 (424868-V)；严禁提取买方的注册号；票面同时出现新旧号时按原文完整保留。
            purchaseOrderNumber:
              type: STRING
              description: |-
                采购订单号。
                通用规则：查找 PO number / P/O No / Cust PO / CUSTOMER P/O NO 等标注。仅当该单号适用于整张发票时提取；如果单号只对应某一明细行，则不填此字段，填入对应明细行的 purchaseOrderNumber 中。
                马来西亚发票补充规则：查找 "P/O No."、"Your PO No."、"PO No"、"Order No"、"Buyer's Order No"、"P.O.NO."（表头）；典型格式如 W1 537443、K2 513875、W1 525065、N1 547225、90001110；通常由字母前缀（W1/K2/N1 等）+ 数字组成，可能含空格分隔（如 W1 516992），提取时保留原始空格格式；当票面以 "P.O.NO. D.O.NO. SALES REP." 横向表头形式呈现时，PO 值通常位于表头下方第二行。
            dueDate:
              type: STRING
              description: 付款截止日期。
            salesOrderNumber:
              type: STRING
              description: 销售订单号，如 SO No / S/O No / Sales order / SO#。仅当该单号适用于整张发票时提取；如果单号只对应某一明细行，则不填此字段，填入对应明细行的 salesOrderNumber 中。
            deliveryOrderNumber:
              type: STRING
              description: |-
                发货单号 / 交货单号。
                通用规则：查找 Packing slip / D.O.NO. / D/O NO / DO 等标注，常见格式如 DO-153555、DO251728。仅当该单号适用于整张发票时提取；如果单号只对应某一明细行，则不填此字段，填入对应明细行的 deliveryOrderNumber 中。
                马来西亚发票补充规则：查找 "D/O No."、"Our D/O No"、"DO NO"、"D.O. No."、"REFER D/O"、"D.O.NO."（表头）；典型格式如 E-DO00863、DO2601/0543、SH34756、LTA2507250095、T 056331、90001110；一张发票可能含多个 DO 号，必须全部列出并以分号";"分隔写入同一字段；当票面以 "P.O.NO. D.O.NO. SALES REP." 横向表头形式呈现时，DO 值通常位于表头下方第一行（多为纯数字）。
            detailOfGoodsOrServices:
              type: ARRAY
              description: 商品或服务明细列表，包括每项商品或服务的名称、备注、数量、单位、单价、不含税金额、税率、税额、含税金额、订单号、销售订单号和发货单号
              items:
                type: OBJECT
                properties:
                  articleName:
                    type: STRING
                    description: 商品或服务名称（需要提取完整信息）
                  description:
                    type: STRING
                    description: 备注
                  quantity:
                    type: NUMBER
                    description: |-
                      商品或服务的数量。
                      单位列辨识：若该行的"数量/单价"分多列子标题（如 PCS / BDL / MT / CTN / SET），
                      优先取**计费单位**对应的列（与 unitPrice 同列）。
                      参考校验：quantity × unitPrice 应约等于 netAmount（具体一致性阈值见 Part 3.4）。
                  unitOfMeasure:
                    type: STRING
                    description: 计量单位，如 pcs、kg、m、hour 等
                  unitPrice:
                    type: NUMBER
                    description: 商品或服务的单价
                  netAmount:
                    type: NUMBER
                    description: 不含税金额
                  taxRate:
                    type: STRING
                    description: 税率
                  tax:
                    type: NUMBER
                    description: 税额
                  grossAmount:
                    type: NUMBER
                    description: 含税金额
                  orderNumber:
                    type: STRING
                    description: 订单号（注文番号）
                  salesOrderNumber:
                    type: STRING
                    description: 本明细行对应的销售订单号，如 SO No / S/O No / Sales order / SO#。仅当该单号只对应本明细行时填入；如果单号适用于整张发票所有明细，则不填此字段，填入发票头部的 salesOrderNumber 中。
                  deliveryOrderNumber:
                    type: STRING
                    description: 本明细行对应的发货单号，如 Packing slip / D.O.NO. / D/O NO / DO，常见格式如 DO-153555、DO251728。仅当该单号只对应本明细行时填入；如果单号适用于整张发票所有明细，则不填此字段，填入发票头部的 deliveryOrderNumber 中。
                  purchaseOrderNumber:
                    type: STRING
                    description: 本明细行对应的采购订单号，如 P/O No / Cust PO / CUSTOMER P/O NO。仅当该单号只对应本明细行时填入；如果单号适用于整张发票所有明细，则不填此字段，填入发票头部的 purchaseOrderNumber 中。
                required: []
            detailOfTaxSummary:
              type: ARRAY
              description: |-
                税金汇总列表，包括税种、税率、税基、税额。
                同一票据可能同时存在加项税（VAT / SST / GST）与减项税（WHT / 预扣税），都要逐一提取。
                同一税种但不同税率的情况需要分别提取为多行。
                装配规则与一致性校验见 Part 3.3（含 ADJUSTMENT 平账机制）。
              items:
                type: OBJECT
                properties:
                  taxCategory:
                    type: STRING
                    description: "税种简称。优先使用平台标准简称（VAT/SST/GST/WHT/CIT/CT/IVA/ADJUSTMENT），不在表中用票面原名。"
                  taxRate:
                    type: STRING
                    description: 税率
                  netTaxableAmount:
                    type: NUMBER
                    description: 税基（需计税的金额/不含税金额）
                  tax:
                    type: NUMBER
                    description: |-
                      税额。识别原则：
                      1. **语义优先**：优先提取明确标识为 Tax / SST / VAT / GST / Tax Amount 的数值。
                      2. **结构识别**：在多行税率汇总表（Tax Summary）中提取每个税种的金额合计，
                         不是简单取表底的 Total / Subtotal。
                      3. **严禁推算**：不要用 totalAmount − 某项反推税额，必须在票面找到对应的税金标识。
                required: []
            originalInvoiceReferences:
              type: ARRAY
              description: 原始发票引用列表。仅当 invoiceType 为 'Credit Note' 时提取；其他发票类型保留该字段但内容为空。票面上可能存在多组原始发票信息，每组作为一个元素输出。
              items:
                type: OBJECT
                properties:
                  originalInvoiceCode:
                    type: STRING
                    description: 原发票代码（序列号），如票面无此信息则不输出。
                  originalInvoiceNumber:
                    type: STRING
                    description: 原发票号码。
                  originalInvoiceDate:
                    type: STRING
                    description: 原发票开票日期，格式 YYYY-MM-DD。
                required: []
          required:
            - docType
            - invoiceType
            - page
            - currency
        - type: OBJECT
          properties:
            docType:
              type: STRING
              description: 其他类型文档
              enum:
                - other
            page:
              type: ARRAY
              description: 所在文档中的页码列表（从1开始编号）。
              items:
                type: NUMBER
          required:
            - docType
            - page